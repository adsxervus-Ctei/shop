<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d5c63">
<title>La Wuaka</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ====================== VARIABLES Y BASE ====================== */
:root{
  --pri:#0d5c63; --pri-d:color-mix(in srgb,var(--pri) 80%,#000); --pri-l:color-mix(in srgb,var(--pri) 9%,#fff);
  --acc:#c6f432; --osc:#14181b; --sale:#c8102e; --gold:#f2b51d; --bg:#f1f3f2; --sur:#ffffff; --sur-2:#f1f3f2; --ink:#14181b; --ink-2:#4a525c; --mut:#6b7280; --line:#e3e6e5;
  --ok:#1e8a45; --ok-l:#e5f4ea; --warn:#b7791f; --warn-l:#fff4d6; --err:#d93636; --err-l:#fdecec; --info:#1d4ed8; --info-l:#dbeafe;
  --rad:16px; --rad-s:10px; --sh:0 1px 2px rgba(20,24,27,.05),0 6px 18px rgba(20,24,27,.06); --sh-2:0 16px 44px rgba(20,24,27,.18);
  --font:Figtree,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --z-head:10; --z-bnav:15; --z-side:20; --z-drawer:40; --z-modal:50; --z-dlg:60; --z-toast:70;
  --head-h:80px; --bnav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
html{height:100%} body{min-height:100%}
body{font:14.5px/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--pri);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.2}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}
.mut{color:var(--mut)} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px;border-radius:8px}

/* ====================== LAYOUT ====================== */
.wrapw{max-width:1320px;margin:0 auto;width:100%;padding:0 20px}
.strip{background:#eef0f2;color:var(--ink);font-size:13.5px}
.strip-in{display:flex;align-items:center;gap:14px;min-height:46px}
.strip-k{font-size:21px;font-weight:800;color:var(--pri);letter-spacing:-.02em}
.strip-t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.strip-s{color:var(--ink-2)}
.strip .icon-btn{width:32px;height:32px;border-radius:8px}
.utilbar{background:var(--sur);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.ub-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:34px}
.ub-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub-r{display:flex;align-items:center;gap:22px}
.ub-r a{color:var(--ink-2);white-space:nowrap}
.ub-r a:hover{color:var(--pri)}
.hd{position:sticky;top:0;z-index:var(--z-head);background:var(--sur);box-shadow:0 1px 0 var(--line),0 8px 20px rgba(20,24,27,.04)}
.top-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:78px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);min-width:0}
.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--pri);display:grid;place-items:center;color:#fff;overflow:hidden;flex:none}
.brand .logo .ic{width:24px;height:24px}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.b-t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.b-t b{font-size:25px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}
.b-t b em{font-style:normal;color:var(--pri)}
.b-t small{font-size:11.5px;color:var(--ink-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;margin-top:3px}
.search{flex:1;display:flex;align-items:stretch;border:2px solid var(--pri);border-radius:10px;height:48px;max-width:700px;margin:0 auto;overflow:hidden;background:var(--sur);transition:box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 15%,transparent)}
.search select{border:0;border-right:1px solid var(--line);background:var(--sur-2);padding:0 10px;max-width:180px;font-weight:600;font-size:13.5px;outline:0;cursor:pointer;color:var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;padding:0 14px;background:transparent}
.sbtn{width:58px;border:0;background:var(--pri);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.sbtn:hover{background:var(--pri-d)}
.tact{display:flex;align-items:center;gap:2px;margin-left:auto}
.acct-w{position:relative}
.acct{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 10px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--ink);text-align:left}
.acct:hover{background:var(--sur-2)}
.acct-t{display:flex;flex-direction:column;line-height:1.1;font-weight:700;font-size:13.5px}
.acct-t small{font-weight:500;font-size:11.5px;color:var(--ink-2)}
.cartbtn{width:auto;padding:0 10px;gap:8px;display:inline-flex}
.cart-t{font-weight:700;font-size:13.5px;color:var(--ink)}
.pop-menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--sur);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:8px;z-index:var(--z-drawer);animation:pop .15s ease}
.pop-menu a,.pop-menu button[role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink);background:none;border:0;font-weight:500;cursor:pointer;text-align:left}
.pop-menu a:hover,.pop-menu button[role=menuitem]:hover{background:var(--sur-2)}
.pm-h{padding:8px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.pm-h small{display:block;color:var(--mut);font-size:12.5px}
.pm-h .btn{margin-top:8px}
.panel-l{color:var(--pri);border-color:color-mix(in srgb,var(--pri) 30%,var(--line))}
.hnav{border-top:1px solid var(--line)}
.hnav-in{display:flex;align-items:center;gap:4px;min-height:52px;overflow-x:auto;scrollbar-width:none}
.hnav-in::-webkit-scrollbar{display:none}
.hnav a{color:var(--ink);font-weight:600;font-size:14px;padding:8px 11px;border-radius:8px;white-space:nowrap;transition:background .15s,color .15s}
.hnav a:hover,.hnav a.on{color:var(--pri);background:var(--pri-l)}
.zona-b{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;padding:4px 14px 4px 0;margin-right:6px;border-right:1px solid var(--line);text-align:left;color:var(--ink);flex:none}
.zona-b .ic{color:var(--pri)}
.zona-b small{display:block;font-size:11.5px;color:var(--ink-2);line-height:1.1}
.zona-b b{font-size:13.5px;white-space:nowrap}
.dep-w{flex:none}
.dep-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;margin-right:8px;border:0;border-radius:8px;background:var(--acc);color:var(--osc);font-weight:700;cursor:pointer;white-space:nowrap;transition:filter .15s}
.dep-btn:hover{filter:brightness(.94)}
.dep-menu{position:fixed;width:min(580px,calc(100vw - 16px));max-height:72vh;overflow:auto;background:var(--sur);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-2);padding:12px;z-index:var(--z-drawer);animation:pop .15s ease}
.dm-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:4px 8px 8px}
.dm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px}
.dm-grid a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:600;font-size:14px}
.dm-grid a span:nth-child(2){flex:1}
.dm-grid a .ic{color:var(--mut)}
.dm-grid a:hover{background:var(--pri-l);color:var(--pri)}
.dm-e{width:32px;height:32px;border-radius:9px;background:var(--sur-2);display:grid;place-items:center;font-size:17px;flex:none}
.dm-f{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.dm-f a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--sur-2);color:var(--ink);font-weight:600;font-size:13px}
.dm-f a:hover{background:var(--pri-l);color:var(--pri)}
.open-n{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ok);white-space:nowrap}
.live{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
body:not(.shop) .strip,body:not(.shop) .utilbar,body:not(.shop) .hnav{display:none}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--sur-2);color:var(--ink)}
.dot{position:absolute;top:4px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sale);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--sur)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:14px}
.shell{display:flex;min-height:calc(100vh - var(--head-h))}
.side{width:248px;flex:none;padding:14px 10px;border-right:1px solid var(--line);background:var(--sur);position:sticky;top:var(--head-h);height:calc(100vh - var(--head-h));overflow:auto}
.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.side a:hover{background:var(--sur-2)} .side a.on{background:var(--pri-l);color:var(--pri)}
.side .sep{height:1px;background:var(--line);margin:10px 6px}
main{flex:1;min-width:0;padding:18px 18px 40px;max-width:1240px;margin:0 auto;width:100%;outline:0}
.bnav{display:none}
.netbar{position:fixed;left:0;right:0;top:0;z-index:var(--z-toast);background:var(--warn);color:#fff;text-align:center;font-size:13px;padding:4px}
@media (min-width:861px){#btnMenu{display:none}}
@media (max-width:860px){
  .side{position:fixed;left:0;top:0;height:100%;z-index:var(--z-drawer);transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--sh-2);padding-top:20px}
  .side.open{transform:none}
  main{padding:14px 12px calc(var(--bnav-h) + 24px + var(--safe-b))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bnav);background:var(--sur);border-top:1px solid var(--line);padding-bottom:var(--safe-b);height:calc(var(--bnav-h) + var(--safe-b))}
  .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mut);background:none;border:0;position:relative}
  .bnav .on{color:var(--pri)}
  .search{order:5;flex-basis:100%;max-width:none}
  .brand span{max-width:42vw}
}
.scrim{position:fixed;inset:0;background:rgba(5,12,15,.45);z-index:calc(var(--z-drawer) - 1);animation:fade .18s}
@keyframes fade{from{opacity:0}}

/* ====================== COMPONENTES ====================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--sur);color:var(--ink);font-weight:650;cursor:pointer;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--sur-2)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff} .btn.pri:hover{background:var(--pri-d)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#1b1300}
.btn.danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,var(--line))} .btn.danger:hover{background:var(--err-l)}
.btn.ghost{border-color:transparent;background:transparent} .btn.ghost:hover{background:var(--sur-2)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sur-2);color:var(--ink-2);white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)} .b-warn{background:var(--warn-l);color:var(--warn)} .b-err{background:var(--err-l);color:var(--err)} .b-info{background:var(--info-l);color:var(--info)} .b-pri{background:var(--pri-l);color:var(--pri)}
.page-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.page-h h1{font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.page-h .sub{color:var(--mut);font-size:13.5px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}
.sec-h h2{font-size:18px;font-weight:800}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--sur);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--sur)}
.chip .n{background:var(--sur-2);color:var(--ink-2);border-radius:999px;padding:0 7px;font-size:12px}
.chip.on .n{background:color-mix(in srgb,var(--sur) 25%,transparent);color:var(--sur)}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.empty .ic{width:44px;height:44px;stroke-width:1.5;margin-bottom:8px;color:var(--line)}
.empty .btn .ic{width:18px;height:18px;margin:0;color:inherit;stroke-width:2}
.sentinel{height:1px}
.loadmore{display:flex;justify-content:center;padding:14px;color:var(--mut)}
.skel{background:linear-gradient(90deg,var(--sur-2) 25%,color-mix(in srgb,var(--sur-2) 50%,var(--sur)) 50%,var(--sur-2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{margin:0;max-width:340px;background:var(--sur);border-color:var(--line)}
.sel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--sur);padding:0 10px;max-width:220px}
.filters{display:contents} .only-m{display:none!important}
#coCup::placeholder{text-transform:none}
@media (max-width:620px){.only-m{display:inline-flex!important}.filters{display:none;width:100%;gap:8px;flex-wrap:wrap}.filters.open{display:flex}.filters .sel{flex:1 1 45%;max-width:none}.toolbar .search{max-width:none;flex:1}}

/* ====================== CATÁLOGO ====================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.slogo{width:56px;height:56px;border-radius:14px;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden;flex:none}
.slogo img{width:100%;height:100%;object-fit:cover}
.store-hero{border-radius:22px;overflow:hidden;background:var(--sur);border:1px solid var(--line)}
.store-hero .cover{height:170px;background:linear-gradient(120deg,var(--osc),var(--pri));background-size:cover;background-position:center}
.store-hero .info{display:flex;gap:14px;padding:0 16px 16px;align-items:flex-end;flex-wrap:wrap}
.store-hero .slogo{width:84px;height:84px;margin-top:-34px;border:4px solid var(--sur);border-radius:20px;font-size:28px}
.stars{color:var(--gold);font-weight:700}

/* ====================== FORMULARIOS ====================== */
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.frm .full,.frm .fld-textarea,.frm .fld-img,.frm .fld-multi{grid-column:1/-1}
@media (max-width:620px){.frm{grid-template-columns:1fr}}
.fld label{display:block;font-size:13px;font-weight:650;margin-bottom:5px;color:var(--ink-2)}
.fld .req{color:var(--err)}
.inp,.fld input:not([type=checkbox]):not([type=radio]):not([type=file]),.fld select,.fld textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--sur);padding:10px 12px;outline:0;transition:border-color .15s,box-shadow .15s}
.fld textarea{resize:vertical;min-height:90px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 15%,transparent)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
.hint{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.ferr{display:block;color:var(--err);font-size:12px;margin-top:4px;min-height:0}
.pw{position:relative} .pw input{padding-right:46px!important}
.pw .icon-btn{position:absolute;right:2px;top:1px;width:42px;height:42px}
.sw,.fld label.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--pri)} .sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
.sw em{font-style:normal;font-size:13.5px;font-weight:600}
.fld-sw{display:flex;flex-direction:column;justify-content:center}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;margin:0;cursor:pointer}
.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgprev{width:96px;height:96px;border-radius:14px;background:var(--sur-2);display:grid;place-items:center;overflow:hidden;color:var(--mut)}
.imgprev img{width:100%;height:100%;object-fit:cover}
.refpick{display:flex;gap:6px} .refpick input{flex:1.1} .refpick select{flex:1.4}
.form-err{grid-column:1/-1;background:var(--err-l);color:var(--err);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.ffoot{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;padding-top:6px}
.radio-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-cards label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:650}
.radio-cards input{accent-color:var(--pri)}
.radio-cards label:has(input:checked){border-color:var(--pri);background:var(--pri-l)}

/* ====================== MODAL / DRAWER / TOAST ====================== */
.modal{position:fixed;inset:0;z-index:var(--z-modal);display:grid;place-items:center;padding:20px;background:rgba(5,12,15,.5);animation:fade .15s}
.mbox{background:var(--sur);border-radius:22px;width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:var(--sh-2);animation:pop .18s ease}
.mbox.wide{width:min(860px,100%)}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mh h3{flex:1;font-size:17px;font-weight:800}
.mb{padding:18px;overflow:auto}
@media (max-width:620px){
  .modal{place-items:end stretch;padding:0}
  .mbox,.mbox.wide{width:100%;border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:var(--safe-b);animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}}
}
.dlg{z-index:var(--z-dlg)}
.dlg .mbox{width:min(420px,100%)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--sur);z-index:var(--z-drawer);display:flex;flex-direction:column;box-shadow:var(--sh-2);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.drawer .mb{flex:1}
.dfoot{border-top:1px solid var(--line);padding:14px 18px calc(14px + var(--safe-b))}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(440px,calc(100% - 24px))}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--sur);padding:12px 14px;border-radius:14px;box-shadow:var(--sh-2);font-weight:600;font-size:14px;width:100%;animation:pop .2s}
.toast.ok .ic{color:#4ade80} .toast.err{background:var(--err);color:#fff} .toast.info .ic{color:#93c5fd}
.toast button{margin-left:auto;background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer}

/* ====================== CARRITO / PEDIDOS ====================== */
.cgroup{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.citem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}
.citem:first-of-type{border-top:0}
.citem .th{width:48px;height:48px;border-radius:10px;background:var(--sur-2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--mut)}
.citem .th img{width:100%;height:100%;object-fit:cover}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:34px;height:34px;border:0;background:var(--sur);cursor:pointer;display:grid;place-items:center}
.stepper span{min-width:30px;text-align:center;font-weight:700}
.sum{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)} .sum.tot{font-weight:800;color:var(--ink);font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:420px){.plist{grid-template-columns:1fr}}
.ped{padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line)}
.ped.st-pendiente{border-left-color:var(--warn)} .ped.st-en_camino,.ped.st-listo{border-left-color:var(--info)} .ped.st-entregado{border-left-color:var(--ok)} .ped.st-cancelado,.ped.st-rechazado{border-left-color:var(--err)} .ped.st-aceptado,.ped.st-preparando{border-left-color:var(--pri)}
.ped-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ped-h small{display:block;color:var(--mut);font-size:12px}
.ped-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:13px}
.ped-meta span{display:inline-flex;align-items:center;gap:5px}
.items{list-style:none;margin:0;padding:10px 12px;background:var(--sur-2);border-radius:12px;font-size:13.5px}
.items li{display:flex;gap:8px;padding:2px 0} .items li b{margin-left:auto;font-weight:650} .items li span{color:var(--mut);min-width:26px}
.ped-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.ped-foot .tot{font-size:17px;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.prog{display:flex;gap:4px} .prog i{flex:1;height:5px;border-radius:3px;background:var(--sur-2)} .prog i.on{background:var(--pri)}
.tl{list-style:none;margin:0;padding:0 0 0 6px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line)}
.tl li:last-child{border-left-color:transparent}
.tl li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid var(--sur)}
.tl small{display:block;color:var(--mut)}
.rate{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}
.rate button{border:0;background:none;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--gold)} .rate .ic{width:36px;height:36px;fill:currentColor}

/* ====================== GESTIÓN ====================== */
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gitem.sel{border-color:var(--pri);background:var(--pri-l)}
.gitem .ck input{width:18px;height:18px;accent-color:var(--pri)}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--sur-2);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--mut)}
.thumb img{width:100%;height:100%;object-fit:cover}
.gmain{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.gmain b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.kv i{font-style:normal;color:var(--mut)}
.gtog{display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:620px){.gitem{flex-wrap:wrap}.gtog{width:100%;padding-left:30px}.gtog em{font-size:12px}}
.bulkbar{position:sticky;top:calc(var(--head-h) + 6px);z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:var(--sur);border-radius:14px;padding:8px 12px;margin-bottom:10px;box-shadow:var(--sh-2)}
.bulkbar .btn{height:34px;background:transparent;color:var(--sur);border-color:color-mix(in srgb,var(--sur) 30%,transparent)}
.bulkbar .sel{height:34px;background:var(--ink);color:var(--sur);border-color:color-mix(in srgb,var(--sur) 30%,transparent)}
.cfgrow{display:grid;grid-template-columns:240px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.cfgrow:first-child{border-top:0}
.cfgrow code{font-weight:700;font-size:13px}
@media (max-width:720px){.cfgrow{grid-template-columns:1fr}}

/* ====================== PANEL ====================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600}
.kpi .l .ic{color:var(--pri)}
.kpi .v{font-size:24px;font-weight:850;letter-spacing:-.02em}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--sur);padding:8px 10px;border-radius:10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);box-shadow:var(--sh-2)}
.meter{display:grid;grid-template-columns:110px 1fr 40px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.meter .bar{height:8px;border-radius:4px;background:var(--sur-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.toplist{list-style:none;margin:0;padding:0;counter-reset:t}
.toplist li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.toplist li:first-child{border-top:0}
.toplist li::before{counter-increment:t;content:counter(t);width:22px;height:22px;border-radius:50%;background:var(--sur-2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.toplist b{margin-left:auto}
.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-weight:600}
/* ====================== TIENDA (diagramación marketplace) ====================== */
@media (min-width:861px){ body.shop .side{display:none} }
body.shop main{max-width:1320px;padding-top:20px}
body.home main{max-width:none;padding:0 0 34px;background:var(--sur)}
body.home .foot{margin-top:0}
.btn.dark{background:var(--osc);border-color:var(--osc);color:#fff}
.btn.dark:hover{background:#000}
.btn.lime{background:var(--acc);border-color:var(--acc);color:var(--osc);font-weight:700;border-radius:8px}
.btn.lime:hover{filter:brightness(.94)}
.btn.white{background:#fff;border-color:#fff;color:var(--osc);border-radius:8px}
.sec{padding-top:6px}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2 small{font-size:13px;font-weight:500;color:var(--ink-2)}
.sec-h a{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--ink);font-size:14px}
.sec-h a:hover{color:var(--pri)}
.sec-gray{background:var(--bg);padding:8px 0 22px;margin-top:26px}
#productos{scroll-margin-top:calc(var(--head-h) + 16px)}
/* franja de pautas */
.band{position:relative;overflow:hidden;isolation:isolate;padding:24px 0;background-color:var(--band,#0d5c63);transition:background-color .9s ease}
.difu{position:absolute;inset:-70px;z-index:-1;pointer-events:none}
.difu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(36px) saturate(1.15);opacity:0;transition:opacity .9s ease}
.difu img.on{opacity:.5}
.band::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.2))}
.band-in{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:20px}
.slider{position:relative;min-height:380px;border-radius:8px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.28);background:var(--osc)}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:30px 72px 56px;color:#fff;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s;background:radial-gradient(80% 120% at 85% 15%,rgba(255,255,255,.18),transparent 60%),linear-gradient(115deg,color-mix(in srgb,var(--sc) 72%,#000),var(--sc))}
.slide.on{opacity:1;visibility:visible}
.sl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6s ease}
.slide.on .sl-bg{transform:scale(1)}
.slide.has-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.66) 0%,rgba(0,0,0,.3) 55%,rgba(0,0,0,0) 100%)}
.sl-deco{position:absolute;right:7%;top:50%;width:250px;height:250px;margin-top:-125px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 24px rgba(255,255,255,.05),0 30px 60px rgba(0,0,0,.18);display:grid;place-items:center}
.sl-deco .ic{width:120px;height:120px;stroke-width:1.1}
.slide.on .sl-deco{animation:flota 6s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-10px)}}
.sl-tx{position:relative;z-index:2;max-width:540px}
.sl-k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:5px;margin-bottom:12px}
.sl-tx h2{font-size:clamp(26px,2.8vw,40px);font-weight:800;text-transform:uppercase;line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.sl-tx p{margin:12px 0 22px;opacity:.92;font-size:15.5px;max-width:460px}
.sl-tx .btn{height:46px;padding:0 22px}
.slide.on .sl-tx>*{animation:entra .65s cubic-bezier(.2,.7,.2,1) both}
.slide.on .sl-tx>:nth-child(2){animation-delay:.12s}
.slide.on .sl-tx>:nth-child(3){animation-delay:.24s}
.slide.on .sl-tx>:nth-child(4){animation-delay:.38s}
@keyframes entra{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.sl-arr{position:absolute;top:50%;z-index:3;width:40px;height:48px;margin-top:-24px;border:0;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .15s}
.sl-arr:hover{background:#fff}
.sl-arr.l{left:0;border-radius:0 8px 8px 0}.sl-arr.r{right:0;border-radius:8px 0 0 8px}
.dots{position:absolute;left:72px;bottom:24px;z-index:3;display:flex;gap:6px}
.dots button{width:22px;height:4px;border:0;padding:0;border-radius:2px;background:rgba(255,255,255,.45);cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:36px;background:#fff}
.side-promos{display:grid;grid-template-rows:1fr 1fr;gap:20px}
.promo{position:relative;overflow:hidden;border:0;border-radius:8px;color:#fff;text-align:left;padding:22px;display:flex;align-items:flex-end;gap:12px;cursor:pointer;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 62%,#000));box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .25s,box-shadow .25s;min-height:150px}
.promo:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(0,0,0,.28)}
.pr-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.promo:hover .pr-bg{transform:scale(1.05)}
.promo.has-img::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,.05) 70%)}
.pr-x{position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:0 0 0 26px rgba(255,255,255,.04)}
.pr-t{position:relative;z-index:2;flex:1}
.pr-t b{display:block;font-size:21px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
.pr-t small{display:block;margin-top:6px;opacity:.88;font-size:13.5px}
.promo>.ic{position:relative;z-index:2;color:var(--acc);width:26px;height:26px;transition:transform .25s}
.promo:hover>.ic{transform:translateX(4px)}
/* atajos */
.atajos{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--sur);border:1px solid var(--line);border-radius:8px;margin:20px 0 4px;overflow:hidden}
.atajo{display:flex;gap:12px;align-items:flex-start;padding:18px 16px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);transition:background .2s}
.atajo+.atajo{border-left:1px solid var(--line)}
.atajo:hover{background:var(--pri-l)}
.atajo:hover .aj-i{background:var(--pri);color:#fff}
.aj-i{width:40px;height:40px;border-radius:50%;background:var(--sur-2);color:var(--pri);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.aj-t b{display:block;font-size:13.5px;font-weight:700;line-height:1.25}
.aj-t small{display:block;font-size:12px;color:var(--ink-2);margin:4px 0 6px;line-height:1.35}
.aj-t em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--pri)}
/* rieles */
.railw{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 70px) / 6);gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:4px 2px 12px}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.r-arr{position:absolute;top:38%;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sur);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .2s,transform .2s}
.railw:hover .r-arr,.r-arr:focus-visible{opacity:1}
.r-arr:hover{transform:scale(1.06)}
.r-arr.l{left:-16px}.r-arr.r{right:-16px}
.rail.stories{grid-auto-columns:96px;gap:12px}
.stories .r-arr{top:26px}
.story{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);text-align:center}
.st-ring{width:82px;height:82px;border-radius:50%;padding:3px;background:var(--line);transition:transform .25s}
.story.open .st-ring{background:conic-gradient(from 210deg,var(--acc),var(--pri),var(--acc))}
.story:hover .st-ring{transform:scale(1.06)}
.st-img{width:100%;height:100%;border-radius:50%;border:3px solid var(--sur);background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden}
.st-img img{width:100%;height:100%;object-fit:cover}
.st-n{font-size:12px;font-weight:600;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* súper ofertas */
.flash{margin-top:26px}
.flash-h{background:var(--sale)}
.fh-in{display:flex;align-items:center;gap:16px;min-height:70px;color:#fff;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.fh-in h2{font-size:27px;font-weight:800;letter-spacing:-.015em}
.fh-t{font-size:13.5px;font-weight:600}
.clock{display:flex;gap:6px}
.clock span{background:#fff;color:var(--ink);border-radius:6px;min-width:56px;text-align:center;padding:5px 6px;line-height:1.1}
.clock b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.clock small{font-size:10.5px;color:var(--ink-2)}
.flash .railw{padding-top:16px}
.cattiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:26px 0 0}
.ctile{display:grid;grid-template-columns:30% 36% minmax(0,1fr);align-items:center;height:146px;border-radius:6px;overflow:hidden;background:#b20e27;color:#fff;text-align:center;transition:transform .25s,box-shadow .25s}
.ctile:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(178,14,39,.3)}
.ct-n{font-weight:800;text-transform:uppercase;font-size:18px;padding:0 10px;line-height:1.1}
.ct-img{height:100%;background:#8f0b1f;display:grid;place-items:center;overflow:hidden}
.ct-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ctile:hover .ct-img img{transform:scale(1.06)}
.ct-e{font-size:54px}
.ct-p{background:var(--sale);height:100%;display:flex;flex-direction:column;justify-content:center}
.ct-p b{font-size:48px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ct-p small{font-size:11.5px;font-weight:700;letter-spacing:.06em}
/* mejor calificadas */
.rail.top{counter-reset:rk}
.tcard{position:relative;display:flex;flex-direction:column;background:var(--sur);border-radius:12px;overflow:hidden;color:var(--ink);box-shadow:var(--sh);counter-increment:rk;transition:transform .25s,box-shadow .25s}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.tcard::before{content:counter(rk);position:absolute;top:10px;left:10px;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--osc);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.tc-img{aspect-ratio:1/1;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 60%,#000));display:grid;place-items:center;color:#fff;font-size:30px;overflow:hidden}
.tc-img img{width:100%;height:100%;object-fit:cover}
.tc-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.tc-r{font-size:18px}
/* bloques por categoría */
.dep{display:grid;grid-template-columns:200px 280px minmax(0,1fr);background:var(--sur);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:20px 0 0;min-height:1px}
.dep:not(.ready){border:0;margin:0}
.dep-l{padding:20px;display:flex;flex-direction:column;gap:9px}
.dep-l h3{font-size:18px;font-weight:700;margin-bottom:6px;line-height:1.2}
.dep-l a{color:var(--ink);font-size:13.5px}
.dep-l a:hover{color:var(--pri)}
.dep-st{display:flex;align-items:center;gap:8px}
.dep-all{margin-top:auto;text-decoration:underline;font-style:italic;color:var(--ink-2)!important;padding-top:10px}
.mini-logo{width:20px;height:20px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:inline-grid;place-items:center;font-size:8.5px;font-weight:800;overflow:hidden;flex:none}
.mini-logo img{width:100%;height:100%;object-fit:cover}
.vpromo{position:relative;background:var(--osc);min-height:520px;overflow:hidden}
.vp-s{position:absolute;inset:0;border:0;padding:24px 18px 44px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;color:#fff;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--pri) 75%,#000),var(--osc));display:flex;flex-direction:column;align-items:center}
.vp-s.on{opacity:1;visibility:visible}
.vp-s>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 6s ease}
.vp-s.on>img{transform:scale(1)}
.vp-s::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 62%,rgba(0,0,0,.55))}
.vp-ic{position:absolute;inset:0;display:grid;place-items:center;opacity:.25}
.vp-ic .ic{width:110px;height:110px;stroke-width:1}
.vp-shop,.vp-name,.vp-off,.vp-b,.vp-sp{position:relative;z-index:1}
.vp-shop{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:3px}
.vp-name{margin-top:8px;font-size:20px;font-weight:800;background:rgba(0,0,0,.6);padding:6px 14px;line-height:1.2;border-radius:3px}
.vp-off{margin:auto 0;width:86px;height:86px;border-radius:50%;background:var(--sale);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.vp-off b{font-size:25px;line-height:1}.vp-off small{font-size:10px;font-weight:700}
.vp-sp{flex:1}
.vp-b{display:flex;flex-direction:column;align-items:center;gap:10px}
.vp-price{background:rgba(0,0,0,.72);padding:6px 12px;font-weight:800;font-size:18px;border-radius:3px}
.vp-b em{font-style:normal;background:var(--acc);color:var(--osc);font-weight:700;font-size:13px;padding:10px 20px;border-radius:5px;transition:transform .2s}
.vp-s:hover .vp-b em{transform:translateY(-2px)}
.vp-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.vp-dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer}
.vp-dots button.on{background:#fff}
.dep-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start}
.dep-grid .pcard{border-radius:0;border:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:none}
.dep-grid .pcard:hover{transform:none;box-shadow:inset 0 0 0 2px var(--pri)}
.dep-more{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);text-align:center;padding:20px;background:var(--sur-2);transition:background .2s}
.dep-more:hover{background:var(--pri-l);color:var(--pri)}
.dep-more:hover .aj-i{background:var(--pri);color:#fff}
.dep-more small{color:var(--ink-2)}
/* tarjeta de producto */
.pcard{display:flex;flex-direction:column;background:var(--sur);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:box-shadow .25s,transform .25s}
.pcard:hover{box-shadow:0 14px 34px rgba(20,24,27,.14);transform:translateY(-3px)}
.pc-media{position:relative}
.pimg{aspect-ratio:1/1;width:100%;border:0;padding:0;background:var(--sur-2);display:grid;place-items:center;color:var(--mut);cursor:pointer;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.pcard:hover .pimg img{transform:scale(1.06)}
.sale{position:absolute;top:10px;left:10px;background:var(--sale);color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px;pointer-events:none}
.out{position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,27,.78);color:#fff;text-align:center;font-weight:700;font-size:12.5px;padding:6px;pointer-events:none}
.is-out .pimg img{filter:grayscale(.6)}
.qadd,.fav{position:absolute;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:var(--sur);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:background .2s,color .2s,transform .2s,opacity .2s}
.qadd{top:10px;color:var(--pri)}
.qadd:hover{background:var(--pri);color:#fff;transform:scale(1.08)}
.qadd[disabled]{opacity:.45;cursor:not-allowed;background:var(--sur);color:var(--mut);transform:none}
.fav{top:54px;color:var(--ink-2)}
.fav:hover{color:var(--sale);transform:scale(1.08)}
.fav.on{color:var(--sale)} .fav.on .ic{fill:currentColor}
@media (hover:hover){ .pcard .fav:not(.on){opacity:0;transform:translateX(6px)} .pcard:hover .fav{opacity:1;transform:none} }
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ptitle{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.ptitle:hover{color:var(--pri)}
.pprice{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.pprice b{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.pprice s{font-size:12.5px;color:var(--mut)}
.pmeta{display:flex;gap:8px;font-size:12px;color:var(--ink-2)}
.pm-off{color:var(--sale);font-weight:700}
.pchip{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;background:var(--ok-l);color:var(--ok);font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:5px}
.pchip .ic{width:13px;height:13px}
.pchip.off{background:var(--sur-2);color:var(--mut)}
.pstore{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:4px;font-size:12px;color:var(--ink-2);min-width:0}
.pstore span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* tiendas */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.scover{position:relative;display:flex;flex-direction:column;background:var(--sur);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--ink);transition:box-shadow .25s,transform .25s}
.scover:hover{box-shadow:0 14px 34px rgba(20,24,27,.14);transform:translateY(-3px)}
.sc-img{height:120px;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc) 55%,#000));display:grid;place-items:center;color:rgba(255,255,255,.45);overflow:hidden}
.sc-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.scover:hover .sc-img img{transform:scale(1.05)}
.sc-img .ic{width:46px;height:46px;stroke-width:1.4}
.sc-st{position:absolute;top:10px;right:10px}
.sc-st:not(.b-ok){background:rgba(255,255,255,.9)}
.sc-logo{position:absolute;top:94px;left:14px;width:50px;height:50px;border-radius:12px;border:3px solid var(--sur);background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-weight:800;overflow:hidden;box-shadow:var(--sh)}
.sc-logo img{width:100%;height:100%;object-fit:cover}
.sc-b{padding:32px 14px 14px;display:flex;flex-direction:column;gap:3px}
.sc-b b{font-size:15px;font-weight:700}
.sc-b small{color:var(--ink-2);font-size:12.5px}
/* vistos recientemente y llamado a negocios */
.recent{display:grid;grid-auto-flow:column;grid-auto-columns:128px;gap:12px;overflow-x:auto;background:var(--sur);border:1px solid var(--line);border-radius:8px;padding:12px;scrollbar-width:thin}
.rc{border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);padding:0;display:flex;flex-direction:column;gap:4px}
.rc-i{aspect-ratio:1/1;border-radius:6px;background:var(--sur-2);display:grid;place-items:center;overflow:hidden;color:var(--mut)}
.rc-i img{width:100%;height:100%;object-fit:cover}
.rc small{font-size:12px;line-height:1.3;max-height:2.6em;overflow:hidden}
.rc b{font-size:13px}
.biz{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--osc);color:#fff;border-radius:10px;padding:24px 26px;margin:30px 0 4px;position:relative;overflow:hidden}
.biz::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:color-mix(in srgb,var(--acc) 18%,transparent)}
.biz>*{position:relative;z-index:1}
.biz h2{color:var(--acc);font-size:21px}
.biz p{margin:6px 0 0;font-size:13.5px;opacity:.85;max-width:640px}
/* pie de página claro */
.foot{background:var(--sur);border-top:1px solid var(--line);margin-top:34px;color:var(--ink-2)}
.foot-in{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:28px;padding-top:36px;padding-bottom:22px}
.foot p{margin:12px 0 0;font-size:13.5px;max-width:340px;line-height:1.6}
.foot h4{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.foot a{display:block;color:var(--ink-2);padding:4px 0;font-size:13.5px}
.foot a.inl{display:inline;padding:0;color:var(--pri)}
.foot a:hover{color:var(--pri)}
.foot .brand{display:flex}
.foot-k{border-top:1px solid var(--line);padding-top:12px;padding-bottom:12px;font-size:12.5px}
.foot-k p{margin:4px 0;max-width:none}
.foot-k a{display:inline;padding:0}
.foot-k b{color:var(--ink)}
.foot-b{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px;padding-bottom:22px;font-size:12.5px}
.pay{display:flex;gap:6px;flex-wrap:wrap}
.pay span{border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-weight:700;color:var(--ink);font-size:11.5px}
/* catálogo, zonas, información */
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.crumbs a{color:var(--ink-2)} .crumbs a:hover{color:var(--pri)}
.chips a.chip{color:var(--ink-2)} .chips a.chip.on{color:var(--sur)}
.zlist{display:flex;flex-direction:column;gap:8px}
.zitem{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sur);text-align:left;cursor:pointer;width:100%;color:var(--ink)}
div.zitem{cursor:default}
button.zitem:hover,.zitem.on{border-color:var(--pri);background:var(--pri-l)}
.zitem small{display:block;color:var(--ink-2);font-size:12.5px}
.zitem .zt{color:var(--pri)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps small{display:block;color:var(--ink-2)}
/* vende con nosotros */
.vend-hero{display:grid;grid-template-columns:1.4fr .6fr;align-items:center;gap:20px;background:radial-gradient(80% 120% at 90% 10%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 60%),linear-gradient(120deg,var(--osc),color-mix(in srgb,var(--pri) 80%,#000));color:#fff;border-radius:14px;padding:38px 40px;overflow:hidden}
.vh-t h1{font-size:clamp(28px,3.4vw,44px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.vh-t p{opacity:.88;max-width:560px;margin:0 0 20px;font-size:15.5px}
.vh-art{justify-self:center;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 24px rgba(255,255,255,.05);display:grid;place-items:center;color:var(--acc);animation:flota 6s ease-in-out infinite}
.vh-art .ic{width:96px;height:96px;stroke-width:1.2}
.vend-h{font-size:22px;margin:30px 0 14px}
.vend-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.vend-steps li{position:relative;background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.vend-steps small,.vend-perks small{color:var(--ink-2)}
.vs-n{position:absolute;top:14px;right:16px;font-size:28px;font-weight:800;color:var(--line)}
.vend-perks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.vend-perks .card{display:flex;flex-direction:column;gap:8px;box-shadow:none}
/* instalación */
.inst{padding:20px}
.inst-h{display:flex;gap:14px;align-items:flex-start}
.inst-h img{border-radius:18px;box-shadow:var(--sh);flex:none}
.inst-h>div{flex:1;min-width:0}
.inst-h h3{font-size:20px;font-weight:800}
.inst-h small{color:var(--ink-2)}
.inst-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.inst-meta span{display:inline-flex;align-items:center;gap:4px}
.inst-feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.inst-feat>div{background:var(--sur-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.inst-feat .ic{color:var(--pri)}
.inst-feat b{font-size:13.5px}.inst-feat small{font-size:12px;color:var(--ink-2)}
@media (max-width:480px){.inst-feat{grid-template-columns:1fr}}
/* carrito emergente */
.drawer.pop{bottom:auto;width:400px;max-height:74vh;border-radius:16px;border:1px solid var(--line)}
.drawer.pop .mb{max-height:46vh}
.scrim.clear{background:transparent}
.sticky-a{align-self:start;position:sticky;top:calc(var(--head-h) + 12px)}
/* adaptable */
@media (max-width:1240px){
  .rail{grid-auto-columns:calc((100% - 56px) / 5)}
  .atajos{grid-template-columns:repeat(3,minmax(0,1fr))}
  .atajo:nth-child(4){border-left:0} .atajo:nth-child(n+4){border-top:1px solid var(--line)}
  .dep{grid-template-columns:180px 240px minmax(0,1fr)}
  .vend-steps,.vend-perks{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1024px){
  .band-in{grid-template-columns:1fr}
  .side-promos{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .rail{grid-auto-columns:calc((100% - 42px) / 4)}
  .dep{grid-template-columns:1fr}
  .dep-l{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:14px 16px}
  .dep-l h3{width:100%;margin:0}
  .dep-all{margin:0;padding:0}
  .vpromo{display:none}
  .dep-grid .pcard:nth-child(3n+1){border-left:0}
  .search select{display:none}
  .ub-l{display:none} .ub-in{justify-content:flex-end}
  .open-n{display:none}
}
@media (max-width:860px){

  .utilbar{display:none}
  .strip-in{gap:8px;min-height:40px;font-size:12.5px}

  .strip .btn{height:30px;padding:0 10px;font-size:12px}
  .top-in{gap:4px;min-height:0;padding:8px 12px}
  .b-t small{display:none} .b-t b{font-size:21px}
  .brand .logo{width:36px;height:36px;border-radius:10px}
  .search{order:5;flex-basis:100%;max-width:none;height:44px;margin-top:4px}
  .acct-t,.acct>.ic.sm,.cart-t,#favBtn{display:none}
  .hnav-in{min-height:46px;padding:0 12px}
  .hnav a{font-size:13px;padding:6px 9px}
  .dep-btn{height:34px;padding:0 12px}
  .wrapw{padding:0 12px}
  .band{padding:12px 0}
  .slider{min-height:250px}
  .slide{padding:22px 22px 46px}
  .sl-deco{width:150px;height:150px;margin-top:-75px;right:-24px;opacity:.6}
  .sl-deco .ic{width:72px;height:72px}
  .sl-tx{max-width:86%}
  .sl-tx p{font-size:14px;margin:8px 0 14px}
  .sl-tx .btn{height:40px;padding:0 16px}
  .sl-arr{display:none}
  .dots{left:22px;bottom:18px}
  .side-promos{gap:10px}
  .promo{padding:14px;min-height:96px}
  .pr-t b{font-size:15px} .pr-t small{display:none}
  .atajos{display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(215px,72%);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-top:12px}
  .atajos::-webkit-scrollbar{display:none}
  .atajo{scroll-snap-align:start;border-top:0!important}
  .atajo+.atajo,.atajo:nth-child(4){border-left:1px solid var(--line)}
  .rail{grid-auto-columns:44%}

  .st-ring{width:70px;height:70px}
  .r-arr{display:none}
  .fh-in{gap:10px;min-height:58px}
  .fh-in h2{font-size:20px}
  .fh-t{display:none}
  .clock span{min-width:44px;padding:3px 4px}.clock b{font-size:16px}.clock small{font-size:9.5px}
  .cattiles{grid-template-columns:1fr;gap:10px;margin-top:18px}
  .ctile{height:100px}
  .ct-p b{font-size:32px} .ct-n{font-size:14px}

}
@media (max-width:480px){
  .side-promos{grid-template-columns:1fr}

/* ---------- v1.1 · aviso centrado (reemplaza la franja negra) ---------- */
.pp{position:fixed;inset:0;z-index:calc(var(--z-toast) + 5);display:grid;place-items:center;padding:24px;background:rgba(9,22,24,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .18s ease}
.pp.out{animation:ppOut .22s ease forwards}
.pp-box{position:relative;width:min(360px,100%);background:var(--sur);border-radius:26px;padding:26px 22px 20px;text-align:center;box-shadow:0 30px 80px rgba(6,30,33,.35);animation:ppIn .42s cubic-bezier(.2,1.3,.4,1)}
.pp.out .pp-box{animation:ppBoxOut .22s ease forwards}
.pp-art{width:84px;height:84px;margin:-60px auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--pp,var(--pri));color:#fff;box-shadow:0 0 0 7px var(--sur),0 12px 26px color-mix(in srgb,var(--pp,var(--pri)) 45%,transparent);position:relative}
.pp-art .ic{width:40px;height:40px;stroke-width:2.4}
.pp-art::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--pp,var(--pri));opacity:0;animation:ppRing 1.1s .15s ease-out 2}
.pp.ok{--pp:var(--pri)} .pp.err{--pp:var(--sale)} .pp.info{--pp:#6d4fd6} .pp.ped{--pp:#e8590c}
.pp.ok .pp-art .ic{stroke-dasharray:40;stroke-dashoffset:40;animation:ppDraw .5s .18s ease forwards}
.pp.err .pp-art{animation:ppShake .5s .1s}
.pp.info .pp-art .ic,.pp.ped .pp-art .ic{animation:ppBell 1s .1s ease-in-out 2;transform-origin:50% 10%}
.pp-art[data-mascota]{background:none;box-shadow:none;width:120px;height:120px;margin-top:-90px}
.pp-t{font-size:19px;font-weight:850;letter-spacing:-.02em;margin:0 0 4px}
.pp-m{color:var(--ink-2);font-size:14.5px;line-height:1.45;margin:0}
.pp-a{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pp-a .btn{min-width:120px}
.pp-bar{position:absolute;left:22px;right:22px;bottom:9px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.pp-bar i{display:block;height:100%;background:var(--pp,var(--pri));transform-origin:left;animation:ppBar linear forwards}
.pp-sp{position:absolute;width:7px;height:7px;border-radius:2px;top:44px;left:50%;opacity:0;animation:ppSpark .8s .25s ease-out forwards}
@keyframes ppIn{0%{opacity:0;transform:translateY(24px) scale(.86)}100%{opacity:1;transform:none}}
@keyframes ppOut{to{opacity:0}}
@keyframes ppBoxOut{to{opacity:0;transform:translateY(12px) scale(.94)}}
@keyframes ppDraw{to{stroke-dashoffset:0}}
@keyframes ppRing{0%{opacity:.7;transform:scale(.9)}100%{opacity:0;transform:scale(1.45)}}
@keyframes ppShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ppBell{0%,100%{transform:rotate(0)}15%{transform:rotate(16deg)}30%{transform:rotate(-14deg)}45%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}75%{transform:rotate(3deg)}}
@keyframes ppBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ===== La Wuaka · módulo V3 · vitrina ===== */
:root{--w3-rojo:#e23b3b;--w3-rojo-o:#c22f2f;--w3-borde:#e6e9ec}

/* ---------- slider: texto animado sobre la foto ---------- */
.w3-s .sl-k{background:var(--acc);color:#0b1a12;letter-spacing:.08em}
.w3-s .sl-tx h2{max-width:15ch}
.w3-vacio{display:none!important}
.w3-kick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.w3-kick:empty{display:none}
.w3-kick .sl-k{margin:0}
.w3-pat{background:rgba(255,255,255,.94);color:#2b3137;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:5px;padding:4px 9px}
.w3-precio{display:flex;align-items:baseline;gap:12px;margin:2px 0 18px}
.w3-precio b{font-size:clamp(30px,3.4vw,46px);font-weight:900;color:var(--acc);letter-spacing:-.02em;line-height:1}
.w3-precio s{font-size:16px;opacity:.78}
.w3-s .sl-tx p{margin-bottom:14px}
.slide.on .sl-tx>:nth-child(5){animation-delay:.5s}
.w3-sello{position:absolute;z-index:3;right:9%;top:16%;width:96px;height:96px;border-radius:50%;background:var(--acc);color:#0b1a12;display:grid;place-content:center;text-align:center;transform:rotate(-12deg);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.w3-sello b{font-size:27px;font-weight:900;line-height:1;letter-spacing:-.02em}
.w3-sello small{font-size:12px;font-weight:700}
.slide.on .w3-sello{animation:w3Sello .7s .45s cubic-bezier(.2,.8,.3,1.3) both}
@keyframes w3Sello{from{opacity:0;transform:rotate(-40deg) scale(.4)}to{opacity:1;transform:rotate(-12deg) scale(1)}}
.w3-ref{position:absolute;z-index:3;right:12px;bottom:10px;font-size:10.5px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:4px;letter-spacing:.02em;pointer-events:none}
.promo .w3-ref{right:8px;top:8px;bottom:auto;z-index:3}
@media (max-width:860px){
  #slider:has(.w3-s){min-height:340px}
  .w3-s{padding:18px 18px 40px}
  .w3-s .sl-tx{max-width:100%}
  .w3-s .sl-tx h2{font-size:24px}
  .w3-kick{margin-bottom:8px}
  .w3-s .sl-tx p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .w3-ref{font-size:9.5px;right:8px;bottom:8px}
  .w3-sello{width:70px;height:70px;right:16px;top:14px}.w3-sello b{font-size:19px}.w3-sello small{font-size:10px}
  .w3-precio{margin:0 0 12px}.w3-precio b{font-size:28px}
  .w3-s .sl-tx h2{max-width:none;padding-right:64px}
}
@media (prefers-reduced-motion:reduce){.slide.on .w3-sello{animation:none}}

/* ---------- tipos de negocio en cuadritos con foto ---------- */

    </div></div></div>`, { wide: true });
  box.dataset.id = p.id; box.dataset.e = 'Productos'; LOOSE.set('Productos:' + p.id, p);

  let q = 1;
  box.addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; q = Math.min(max || 1, Math.max(1, q + Number(b.dataset.q))); $('#pQ', box).textContent = q; });
  $('#pAdd', box).onclick = () => { if (addToCart(p, q)) closeModal(); };
  try { const full = await call('get', { e: 'Productos', id: p.id }); const d = $('#pDesc', box); if (d) d.textContent = full.descripcion || 'Sin descripción.'; }
  catch (e) { const d = $('#pDesc', box); if (d) d.textContent = ''; }

function saveCart() { store.set('cart', JSON.stringify(S.cart)); updateCartDot(); }
function addToCart(p, c = 1) {
  const max = p.controla_stock === true ? Number(p.stock) : 999;
  const cur = S.cart[p.id] ? S.cart[p.id].c : 0;
  if (cur + c > max) { toast(max > 0 ? `Sólo hay ${max} disponibles.` : 'Producto agotado.', 'err'); return false; }
  S.cart[p.id] = { id: p.id, n: p.nombre, p: Number(p.precio), i: p.imagen || '', t: p.tienda_id, tn: p.tienda_id__n || '', c: cur + c, mx: max };
  saveCart();
  toast(`${p.nombre} agregado`, 'ok', { label: 'Ver carrito', fn: openCart });
  return true;
}
function cartGroups() {
  const g = {};
  Object.values(S.cart).forEach(it => { if (!g[it.t]) g[it.t] = { t: it.t, tn: it.tn, items: [], sub: 0, n: 0 }; g[it.t].items.push(it); g[it.t].sub += it.p * it.c; g[it.t].n += it.c; });
  return Object.values(g);
}
function cartBody() {
  const gs = cartGroups();
  if (!gs.length) return `<div class="empty">${ic('cart')}<p>Tu carrito está vacío.</p><a class="btn pri" href="#/" data-close>Explorar productos</a></div>`;
  return gs.map(g => `<div class="cgroup"><div class="row between"><b>${ic('store', 'sm')} ${esc(g.tn)}</b><span class="mut">${money(g.sub)}</span></div>
    ${g.items.map(it => `<div class="citem"><div class="th">${imgTag(it.i, it.n, 'bag')}</div><div class="grow"><div style="font-weight:600;font-size:14px">${esc(it.n)}</div><small class="mut">${money(it.p)}</small></div>
      <div class="stepper"><button data-act="cq" data-pid="${esc(it.id)}" data-d="-1" aria-label="Menos">${ic(it.c === 1 ? 'trash' : 'minus', 'sm')}</button><span>${it.c}</span><button data-act="cq" data-pid="${esc(it.id)}" data-d="1" aria-label="Más">${ic('plus', 'sm')}</button></div></div>`).join('')}</div>`).join('');
}
function cartTotals() { const v = Object.values(S.cart); return { n: v.reduce((a, i) => a + i.c, 0), t: v.reduce((a, i) => a + i.p * i.c, 0) }; }
function openCart() {

    ${tt.t ? `<div class="dfoot"><div class="sum tot" style="border:0;margin:0;padding:0 0 4px"><span>Subtotal</span><span style="color:var(--pri)">${money(tt.t)}</span></div>

function changeQty(pid, d) {

/* =====================================================================
 * PEDIDOS
 * ===================================================================== */
function actorOf(o) {
  const u = S.user; if (!u) return '';
  if (u.rol === 'admin' || u.rol === 'gestor') return 'admin';
  if (u.rol === 'vendedor' && o.tienda_id === u.tienda_id) return 'vendedor';
  if (u.rol === 'repartidor' && o.repartidor_id === u.id) return 'repartidor';
  if (o.cliente_id === u.id) return 'cliente';
  return '';
}
function pedActions(o) {
  const A = []; const a = actorOf(o); const est = o.estado; const dom = o.tipo_entrega === 'domicilio';
  const dp = !!(S.tienda && S.tienda.delivery_propio); const add = (to, label, cls = '', mot = 0) => A.push({ to, label, cls, mot });
  const activo = ['aceptado', 'preparando', 'listo'].includes(est);
  if (a === 'vendedor' || a === 'admin') {
    if (est === 'pendiente') { add('aceptado', 'Aceptar', 'pri'); add('rechazado', 'Rechazar', 'danger', 1); }
    if (est === 'aceptado') { add('preparando', 'Preparando', 'pri'); add('listo', 'Listo'); add('cancelado', 'Cancelar', 'danger', 1); }
    if (est === 'preparando') { add('listo', 'Marcar listo', 'pri'); add('cancelado', 'Cancelar', 'danger', 1); }
    if (est === 'listo') { if (!dom) add('entregado', 'Entregado', 'pri'); else if (a === 'admin' || dp || o.repartidor_id) add('en_camino', 'En camino', 'pri'); if (a === 'admin') add('cancelado', 'Cancelar', 'danger', 1); }
    if (est === 'en_camino' && (a === 'admin' || dp || !o.repartidor_id)) add('entregado', 'Entregado', 'pri');

/** Barras de una serie: marcas finas, extremo redondeado de 4px anclado a la base, 2px de separación, tooltip al pasar. */
function barChart(s) {
  const W = 640, H = 210, L = 8, R = 8, T = 14, B = 26; const max = Math.max(1, ...s.map(x => x[2]));
  const bw = (W - L - R) / s.length; const ih = H - T - B; const base = H - B;
  const bars = s.map((x, i) => {
    const h = Math.max(x[2] ? 3 : 0, x[2] / max * ih); const xx = L + i * bw + 1; const w = Math.max(2, bw - 2); const y = base - h; const r = Math.min(4, w / 2, h);
    const path = h ? `M${xx},${base} L${xx},${y + r} Q${xx},${y} ${xx + r},${y} L${xx + w - r},${y} Q${xx + w},${y} ${xx + w},${y + r} L${xx + w},${base} Z` : '';
    return `<g data-i="${i}"><rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ih}" fill="transparent"/>${path ? `<path d="${path}" fill="var(--pri)"/>` : ''}
      ${(s.length - 1 - i) % 2 === 0 || s.length < 8 ? `<text x="${xx + w / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mut)">${esc(x[0].slice(8))}</text>` : ''}</g>`;
  }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas entregadas por día en los últimos 14 días">
    <line x1="${L}" x2="${W - R}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg><div class="tip hide"></div></div>`;
}
function bindChart(el, s) {
  if (!el) return; const tip = $('.tip', el); const svg = $('svg', el);
  svg.addEventListener('pointermove', e => {
    const g = e.target.closest('[data-i]'); if (!g) { tip.classList.add('hide'); return; }
    const x = s[Number(g.dataset.i)]; const rb = el.getBoundingClientRect();
    tip.innerHTML = `<b>${fday(x[0])}</b><br>${money(x[2])} · ${num(x[1])} pedido(s)`;
    tip.style.left = (e.clientX - rb.left) + 'px'; tip.style.top = (e.clientY - rb.top) + 'px'; tip.classList.remove('hide');
  });
  svg.addEventListener('pointerleave', () => tip.classList.add('hide'));
}

function fieldHtml(f, v, rec, isNew) {

    case 'money': case 'int': case 'num': inp = `<input id="${id}" name="${f.k}" type="number" inputmode="${f.t === 'num' ? 'decimal' : 'numeric'}" step="${f.t === 'num' ? '0.01' : '1'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} value="${esc(val)}">`; break;
    case 'bool': return `<div class="fld fld-sw" data-k="${f.k}"><label class="sw" style="margin:0"><input type="checkbox" name="${f.k}" ${val === true ? 'checked' : ''}><span></span><em>${esc(f.l)}</em></label>${f.hint ? `<small class="hint">${esc(f.hint)}</small>` : ''}</div>`;
    case 'sel': inp = `<select id="${id}" name="${f.k}">${f.req ? '' : '<option value="">—</option>'}${(f.opts || []).map(o => `<option ${String(val) === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'multi': { const cur = String(val).split(','); return `<div class="fld fld-multi" data-k="${f.k}"><label>${esc(f.l)}${req}</label><div class="checks">${(f.opts || []).map(o => `<label><input type="checkbox" name="${f.k}" value="${esc(o)}" ${cur.includes(o) ? 'checked' : ''}> ${esc(o)}</label>`).join('')}</div>${f.hint ? `<small class="hint">${esc(f.hint)}</small>` : ''}<small class="ferr"></small></div>`; }
    case 'date': inp = `<input id="${id}" name="${f.k}" type="date" value="${esc(String(val).slice(0, 10))}">`; break;

function compressImage(file, max = 1000, q = 0.82) {
  return new Promise((res, rej) => {
    if (String(file.type).indexOf('image') !== 0) return rej(new Error('Selecciona un archivo de imagen.'));
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');

      if (d.length > 2700000) d = c.toDataURL('image/jpeg', 0.6);
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen.')); };
    img.src = url;
  });
}

  if (el.dataset.act === 'g-toggle') gToggle(host(el).dataset.e, r, el.dataset.k, el);
});

const AUD = { ctx: null, buf: {}, on: store.get('snd') !== '0' };
function audUnlock() {
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume().catch(() => { }); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { AUD.ctx = new AC(); } catch (e) { return; }
  Object.keys(SND).forEach(k => {
    try {
      const bin = atob(SND[k].replace(/-/g, '+').replace(/_/g, '\x2f') + '==='.slice((SND[k].length + 3) % 4));
      const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      AUD.ctx.decodeAudioData(u8.buffer, b => { AUD.buf[k] = b; }, () => { });
    } catch (e) { /* formato no soportado */ }
  });
}
['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, audUnlock, { passive: true }));
function sonar(k) {
  if (TONOS[k]) { tono(k); return; }
  if (k === 'pedido' && navigator.vibrate) { try { navigator.vibrate([90, 60, 90, 160, 220]); } catch (e) { /* sin vibración */ } }
  if (!AUD.on || !AUD.ctx || !AUD.buf[k]) return;
  try {
    if (AUD.ctx.state === 'suspended') AUD.ctx.resume();
    const s = AUD.ctx.createBufferSource(); const g = AUD.ctx.createGain();
    s.buffer = AUD.buf[k]; g.gain.value = k === 'exito' ? 0.45 : 0.95; s.connect(g); g.connect(AUD.ctx.destination); s.start();
  } catch (e) { /* audio no disponible */ }
}

/* ---------- aviso centrado con fondo opaco y animación ---------- */
const PPS = { el: null, tm: 0 };
/** Espacio reservado para la mascota animada: Configuración → MASCOTA_URL (GIF, WebP o SVG animado). */
const mascota = () => { const u = safeUrl(S.cfg.MASCOTA_URL); return u ? `<img src="${esc(u)}" alt="" style="width:100%;height:100%;object-fit:contain">` : ''; };
function popup({ title = '', msg = '', type = 'ok', action = null, stay, sound = '', icon = '' } = {}) {
  closePopup(true);
  const ttl = stay !== undefined ? stay : (type === 'err' ? 4200 : type === 'ped' ? 0 : action ? 3400 : 1700);
  const pass = type === 'ok'; // las confirmaciones no bloquean: los toques pasan a la pantalla
  const wrap = document.createElement('div');
  wrap.className = 'pp ' + type; wrap.setAttribute('role', type === 'err' || type === 'ped' ? 'alertdialog' : 'status'); wrap.setAttribute('aria-live', 'assertive');
  if (pass) wrap.style.pointerEvents = 'none';
  const m = mascota();
  const ico = icon || (type === 'err' ? 'alert' : type === 'ok' ? 'check' : type === 'ped' ? 'package' : 'bell');
  const spark = type === 'ok' ? Array.from({ length: 8 }, (x, i) => { const a = i / 8 * Math.PI * 2; return `<i class="pp-sp" style="--dx:${Math.round(Math.cos(a) * 74)}px;--dy:${Math.round(Math.sin(a) * 58)}px;background:${['var(--pri)', 'var(--acc)', 'var(--gold)', 'var(--sale)'][i % 4]}"></i>`; }).join('') : '';
  wrap.innerHTML = `<div class="pp-box" ${pass && !action ? 'style="pointer-events:none"' : 'style="pointer-events:auto"'}><div class="pp-art" ${m ? 'data-mascota' : ''}>${m || ic(ico)}</div>${spark}
    ${title ? `<p class="pp-t">${esc(title)}</p>` : ''}${msg ? `<p class="pp-m">${esc(msg)}</p>` : ''}
    ${action || !pass ? `<div class="pp-a">${!pass || action ? `<button type="button" class="btn ghost" data-ppx>${action ? (type === 'ped' ? 'Después' : 'Cerrar') : 'Entendido'}</button>` : ''}${action ? `<button type="button" class="btn ${type === 'err' ? 'danger' : 'pri'}" data-ppa>${esc(action.label)}</button>` : ''}</div>` : ''}
    ${ttl ? `<div class="pp-bar"><i style="animation-duration:${ttl}ms"></i></div>` : ''}</div>`;
  wrap.addEventListener('click', e => {
    if (e.target.closest('[data-ppa]')) { closePopup(); action.fn(); return; }
    if (e.target === wrap || e.target.closest('[data-ppx]')) closePopup();
  });
  document.body.appendChild(wrap); PPS.el = wrap;
  if (ttl) PPS.tm = setTimeout(closePopup, ttl);
  if (!pass) setTimeout(() => { const b = wrap.querySelector('[data-ppa],[data-ppx]'); if (b) b.focus(); }, 60);
  if (sound) sonar(sound);
  return wrap;
}
function closePopup(now) {
  clearTimeout(PPS.tm); const el = PPS.el; PPS.el = null; if (!el) return;
  if (now) { el.remove(); return; }
  el.classList.add('out'); setTimeout(() => el.remove(), 230);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && PPS.el) closePopup(); }, true);

const esPedidoN = n => /^(Nuevo pedido|Pedido disponible|Te asignaron)/.test(n.titulo || '');
function avisar(list) {
  if (!list.length) return;
  const n = list[0]; const ped = list.some(esPedidoN); const mas = list.length > 1 ? ' · y ' + (list.length - 1) + ' más' : '';
  const ti = TONOS[n.tipo] ? n.tipo : '';
  popup({ type: ped ? 'ped' : 'info', title: n.titulo + mas, msg: n.mensaje, sound: ped ? 'pedido' : (ti || 'aviso'), stay: ped ? 0 : 6000,
    action: { label: ped ? 'Ver pedido' : 'Ver', fn: () => abrirNotif(n) } });
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted' && !PUSH.tok) {

}
function abrirNotif(r) {

  const ref = String(r.ref || '');
  if (/^PED-/.test(ref)) openPedido(ref);
  else if (/^USR-/.test(ref) && esAdm()) { location.hash = '#/g/Usuarios'; setTimeout(() => openForm('Usuarios', ref), 400); }
  else if (/^TND-/.test(ref)) { if (esAdm()) openSolicitud(ref); else if (/aprobada|equipo/i.test(r.titulo || '')) reboot('bienvenida'); else location.hash = role() === 'vendedor' ? '#/panel' : '#/vender'; }
  else if (/^PRD-/.test(ref)) location.hash = staffish() ? '#/g/Productos' : '#/';
  else if (/^EST-/.test(ref)) location.hash = esAdm() ? '#/estados' : '#/mis-estados';

const vehIc = v => ({ carro: 'carro', van: 'van', camion: 'camion', lancha: 'lancha', bici: 'bici' })[v] || 'moto';
const PIN_SVG = '<svg viewBox="0 0 40 52" aria-hidden="true"><path d="M20 51s17-17.6 17-30A17 17 0 0 0 3 21c0 12.4 17 30 17 30z" fill="var(--sale)" stroke="#fff" stroke-width="3"/><circle cx="20" cy="21" r="6.5" fill="#fff"/></svg>';

const TRK = { ids: new Set(), watch: null, last: {}, chip: null };
function trackCheck(r) {
  if (!S.user || !r || !r.id) return;
  const mine = (r.repartidor_id === S.user.id) || (role() === 'vendedor' && r.tienda_id === S.user.tienda_id && S.tienda && S.tienda.delivery_propio && !r.repartidor_id);
  if (mine && r.estado === 'en_camino' && r.tipo_entrega === 'domicilio') TRK.ids.add(r.id); else TRK.ids.delete(r.id);

      TRK.ids.forEach(id => { if (Date.now() - (TRK.last[id] || 0) < 10000) return; TRK.last[id] = Date.now(); call('ubic', { id, pos }).then(x => { if (x && x.off) { TRK.ids.delete(id); trackRun(); } }).catch(() => { }); });
    }, () => { }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }
  if (!TRK.ids.size && TRK.watch != null) { navigator.geolocation.clearWatch(TRK.watch); TRK.watch = null; }
  const show = TRK.ids.size > 0;
  document.body.classList.toggle('tracking', show);

}

}

const distKm = (a, b) => { const R = 6371, r = Math.PI / 180; const dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };

function videoInfo(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const v = document.createElement('video'); v.preload = 'auto'; v.muted = true; v.playsInline = true; v.src = url;
    v.onloadedmetadata = () => { const dur = v.duration; v.currentTime = Math.min(0.6, (dur || 1) / 3); v.onseeked = () => { const c = document.createElement('canvas'); const s = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight)); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s); c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res({ dur, poster: c.toDataURL('image/jpeg', 0.8) }); }; };
    v.onerror = () => { URL.revokeObjectURL(url); rej(new Error('No se pudo leer el video. Usa MP4 grabado con el celular.')); };
  });
}

const WK_MARK = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 18 L21 47 L32 25 L43 47 L54 18"/><circle cx="32" cy="54" r="4"/></svg>';
/** Video o imagen: acepta https o una ruta de la carpeta publicada (p. ej. videos/inicio.mp4). */
function mediaUrl(v) {
  v = String(v || '').trim(); if (!v) return '';
  if (safeUrl(v)) return v;
  if (!IN_GAS && /^[\w-]+(?:\x2f[\w.-]+)*\.(mp4|webm|jpe?g|png|webp)$/i.test(v)) { try { return new URL(v, location.href).href; } catch (e) { return ''; } }
  return '';
}

/* ---------- precarga ---------- */
/** La animación del logo dura unos 2,4 s: la pantalla de carga no se quita antes, para que siempre se vea completa. */
const PRE_MIN = 2400;
let PRE_T = setTimeout(() => preOff(true), 15000); let PRE_W = 0; let SP_REV = false;
function preOff(force) {
  const p = $('#pre'); if (!p || p.classList.contains('out')) return;
  if (!force && $('#splash') && !SP_REV) return;
  const t = performance.now() - (window.__pre0 || 0);
  if (!force && t < PRE_MIN) { clearTimeout(PRE_W); PRE_W = setTimeout(() => preOff(), PRE_MIN - t + 30); return; }
  clearTimeout(PRE_T); clearTimeout(PRE_W); p.classList.add('out'); setTimeout(() => p.remove(), 500);
}
/** Bienvenida: se muestra cuando terminó la animación del logo y la foto ya cargó (o no se pudo cargar). */
function splashReveal() {
  const el = $('#splash'); if (!el || SP_REV) return;
  const im = el.querySelector('.sp-bg img'); const lista = !im || im.classList.contains('ok');
  const t = performance.now() - (window.__pre0 || 0);
  if (t < PRE_MIN || (!lista && t < 7000)) { setTimeout(splashReveal, Math.max(120, PRE_MIN - t)); return; }
  SP_REV = true; el.classList.add('go'); preOff(true); rotarLugar();
}
function preOn() {
  if ($('#pre')) { $('#pre').classList.remove('out'); return; }
  const p = document.createElement('div'); p.id = 'pre'; p.setAttribute('role', 'status'); p.setAttribute('aria-label', 'Cargando');
  p.innerHTML = `<div class="pre-b"><div class="wk-mark">${WK_MARK}</div>${marcaHtml('pre-w wk-anim')}<div class="pre-bar"><i></i></div></div>`;
  document.body.appendChild(p);
}
function appReady() {

  if (!$('#splash')) preOff(); else updSplash();

}
