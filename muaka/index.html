/* ---------- verificación del correo ---------- */
function verifDlg(auto) {
  if (!S.user || S.user.verificado !== false) return;
  if (MODAL && $('#vfForm')) return;
  const mail = S.user.email || '';
  const box = openModal(mHead('Confirma tu correo', 'mail') + `<div class="mb stack"><form id="vfForm" class="stack" novalidate>
    <p style="margin:0">Te enviamos un código de 6 dígitos a <b>${esc(mail)}</b>. Escríbelo aquí.</p>
    <div class="vcode">${'<input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito">'.repeat(6)}</div>
    <small class="mut">¿No te llegó? Revisa la carpeta de Spam o Promociones. Vence en 30 minutos.</small>
    <div class="form-err hide"></div>
    <div class="row wrap" style="gap:8px"><button type="button" class="btn grow" id="vfRe">${ic('refresh', 'sm')} Enviar otro código</button><button class="btn pri grow" type="submit">${ic('check', 'sm')} Confirmar</button></div>
    ${auto ? '<button type="button" class="btn ghost" data-close>Lo hago después</button>' : ''}</form></div>`);
  const ins = $$('.vcode input', box);
  ins.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      const d = inp.value.replace(/\D/g, '');
      if (d.length > 1) { d.split('').slice(0, 6 - i).forEach((c, j) => { ins[i + j].value = c; }); (ins[Math.min(5, i + d.length)] || inp).focus(); }
      else { inp.value = d; if (d && ins[i + 1]) ins[i + 1].focus(); }
      if (ins.every(x => x.value)) $('#vfForm').requestSubmit();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); });

/* =====================================================================
 * v1.6 · SONIDOS POR TIPO, CÁMARA, FORMULARIO DE USUARIOS POR SECCIONES,
 *        HORARIOS CON BOTONES, ESLOGAN CON MUNICIPIOS, VIDEO CON SONIDO
 * ===================================================================== */
/* ---------- sonidos propios por tipo de aviso (sintetizados, no pesan nada) ---------- */
const TONOS = {
  cliente: [[1318.5, 0, .22, 'sine'], [1760, .11, .32, 'sine']],
  tienda: [[523.3, 0, .16, 'triangle'], [659.3, .1, .16, 'triangle'], [784, .2, .16, 'triangle'], [1046.5, .3, .42, 'triangle']],
  solicitud: [[784, 0, .55, 'sine'], [622.3, .32, .7, 'sine']],
  domiciliario: [[440, 0, .1, 'square'], [440, .14, .1, 'square'], [587.3, .3, .24, 'sawtooth']]
};
function tono(k) {
  if (!AUD.on) return; audUnlock(); const c = AUD.ctx; if (!c) return;
  try {
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime + .02; const out = c.createGain(); out.gain.value = .32; out.connect(c.destination);
    TONOS[k].forEach(([f, t, d, w]) => {
      const o = c.createOscillator(); const g = c.createGain(); o.type = w; o.frequency.setValueAtTime(f, t0 + t);
      if (k === 'domiciliario' && w === 'sawtooth') o.frequency.linearRampToValueAtTime(f * 1.18, t0 + t + d);
      g.gain.setValueAtTime(0, t0 + t); g.gain.linearRampToValueAtTime(w === 'square' || w === 'sawtooth' ? .35 : 1, t0 + t + .012); g.gain.exponentialRampToValueAtTime(.0008, t0 + t + d);
      o.connect(g); g.connect(out); o.start(t0 + t); o.stop(t0 + t + d + .05);
      if (w === 'sine') { const h = c.createOscillator(); const hg = c.createGain(); h.type = 'sine'; h.frequency.value = f * 2.76; hg.gain.setValueAtTime(0, t0 + t); hg.gain.linearRampToValueAtTime(.18, t0 + t + .01); hg.gain.exponentialRampToValueAtTime(.0005, t0 + t + d * .6); h.connect(hg); hg.connect(out); h.start(t0 + t); h.stop(t0 + t + d); }
    });
  } catch (e) { /* audio no disponible */ }
}

/** modo: 'foto' | 'selfie' | 'video'. En celular abre la cámara del teléfono; en computador, la cámara web. */
async function camara(modo, maxSeg) {
  const video = modo === 'video';
  if (esMovil() || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return pedirArchivo(video ? 'video\x2f*' : 'image\x2f*', modo === 'selfie' ? 'user' : 'environment');
  return new Promise(resolve => {
    let stream = null; let rec = null; let partes = []; let frente = modo === 'selfie'; let tmr = 0; let t0 = 0;
    const ov = document.createElement('div'); ov.className = 'camov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', video ? 'Grabar video' : 'Tomar foto');
    ov.innerHTML = `<div class="cam-box"><video playsinline autoplay muted></video><div class="cam-rec hide">${ic('video', 'sm')} <b>0 s</b></div>
      <div class="cam-bar"><button type="button" class="btn ghost" data-c="x">Cancelar</button><button type="button" class="cam-shot" data-c="go" aria-label="${video ? 'Grabar' : 'Tomar foto'}"><i></i></button><button type="button" class="btn ghost" data-c="sw" aria-label="Cambiar cámara">${ic('switch')}</button></div></div>`;
    document.body.appendChild(ov);
    const v = $('video', ov); const shot = $('.cam-shot', ov); const lab = $('.cam-rec', ov);
    const parar = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
    const fin = f => { clearInterval(tmr); parar(); ov.remove(); resolve(f || null); };
    const abrir = async () => {
      parar();
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: frente ? 'user' : 'environment', width: { ideal: 1280 } }, audio: video }); v.srcObject = stream; }
      catch (e) { toast('No se pudo abrir la cámara. Revisa el permiso del navegador.', 'err'); fin(await pedirArchivo(video ? 'video\x2f*' : 'image\x2f*')); }
    };
    ov.addEventListener('click', ev => {
      const b = ev.target.closest('[data-c]'); if (!b) return;
      if (b.dataset.c === 'x') { if (rec && rec.state === 'recording') { rec.onstop = null; rec.stop(); } fin(null); }
      if (b.dataset.c === 'sw') { if (!rec) { frente = !frente; abrir(); } }
      if (b.dataset.c === 'go') {
        if (!video) {
          const c = document.createElement('canvas'); c.width = v.videoWidth || 1280; c.height = v.videoHeight || 720;
          const g = c.getContext('2d'); if (frente) { g.translate(c.width, 0); g.scale(-1, 1); } g.drawImage(v, 0, 0, c.width, c.height);
          c.toBlob(bl => fin(bl ? new File([bl], 'foto.jpg', { type: 'image/jpeg' }) : null), 'image/jpeg', .9); return;
        }
        if (rec && rec.state === 'recording') { rec.stop(); return; }
        const tipo = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
        try { rec = new MediaRecorder(stream, tipo ? { mimeType: tipo, videoBitsPerSecond: 1800000 } : {}); } catch (e) { toast('Este navegador no puede grabar video. Usa "Subir video".', 'err'); return; }
        partes = []; rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
        rec.onstop = () => { const mt = (rec.mimeType || tipo || 'video/webm').split(';')[0]; fin(new File([new Blob(partes, { type: mt })], 'video.' + (/mp4/.test(mt) ? 'mp4' : 'webm'), { type: mt })); };
        rec.start(250); t0 = Date.now(); shot.classList.add('rec'); lab.classList.remove('hide');
        tmr = setInterval(() => { const sg = Math.floor((Date.now() - t0) / 1000); $('b', lab).textContent = sg + ' s' + (maxSeg ? ' / ' + maxSeg + ' s' : ''); if (maxSeg && sg >= maxSeg) rec.stop(); }, 250);
      }
    });
    abrir();
  });
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-cam]'); if (!b) return;
  ev.preventDefault();
  const modo = b.dataset.cam; const file = await camara(modo, Number(b.dataset.max) || 0); if (!file) return;

});

  const mesaSvg = (tipo, libre) => tipo === 'billar'

  async function bloqueTienda(main, t) {

    if (mods.includes('mesas') && c.paso_a_paso && !mods.includes('cover')) partes.push(`<section class="wk4-paso"><div><h3>Arma tu pedido paso a paso</h3><p>Escoge por categorías, mira el resumen tipo factura y escoge cómo pagas.</p></div><button class="btn lime" data-act="w4-paso" data-t="${esc(t.id)}">${ic('bag', 'sm')} Empezar</button></section>`);
    if (mods.includes('cover') && c.cover_precio) partes.push(`<section class="card pad wk4-cover"><h3>${ic('users', 'sm')} Cover esta noche</h3><b class="wk4-big">${money(c.cover_precio)}</b>${c.cover_nota ? `<p>${esc(c.cover_nota)}</p>` : ''}</section>`);
    if (recs.length) {
      const libres = recs.filter(r => r.estado === 'libre').length;
      const tarifas = {}; recs.forEach(r => { if (r.tarifa) tarifas[(r.detalle || (tipoRec === 'billar' ? 'Mesa' : 'Habitación'))] = r; });
      partes.push(`<section class="card pad wk4-pubrec"><div class="w3-sech"><h2>${tipoRec === 'habitacion' ? 'Habitaciones libres hoy' : 'Mesas libres ahora'} <span class="wk4-libres">${libres} de ${recs.length}</span></h2></div>
        <div class="wk4-pubgrid ${tipoRec}">${recs.map(r => `<div class="wk4-pr ${r.estado === 'libre' ? 'libre' : ''}">${mesaSvg(r.tipo, r.estado === 'libre')}<small>${esc(r.nombre)}${r.tipo === 'habitacion' && r.detalle ? ' · ' + esc(r.detalle) : ''} · <b>${r.estado === 'libre' ? 'Libre' : r.estado === 'reservada' ? 'Reservada' : r.estado === 'aseo' ? 'En aseo' : 'Ocupada'}</b></small></div>`).join('')}</div>
        ${Object.keys(tarifas).length ? `<ul class="wk4-tar">${Object.keys(tarifas).map(k => `<li><span>${esc(k)} · ${tarifas[k].unidad === 'noche' ? 'la noche' : 'la hora'}</span><b>${money(tarifas[k].tarifa)}</b></li>`).join('')}${tipoRec === 'billar' && c.cobro_billar === 'chico' && c.precio_chico ? `<li><span>Por chico</span><b>${money(c.precio_chico)}</b></li>` : ''}</ul>` : ''}
        ${tipoRec === 'billar' ? '<p class="mut" style="margin:10px 0 0;font-size:13px">El tablero se actualiza solo. Si vas en camino, escríbele al negocio para apartar la mesa.</p>' : ''}</section>`);
    }
    const sols = [];
    if (c.reservas_mesa) sols.push(['reserva_mesa', 'Reservar mesa', 'users']);
    if (c.reservas_habitacion) sols.push(['reserva_habitacion', 'Solicitar reserva', 'home']);
    if (c.cotizaciones) sols.push(['cotizacion', 'Pedir cotización con flete', 'file']);
    if (c.apartados) sols.push(['apartado', 'Pedir un apartado', 'tag']);
    if (sols.length || c.nota_publica) partes.push(`<section class="card pad wk4-sols">${c.nota_publica ? `<p>${esc(c.nota_publica)}</p>` : ''}${sols.length ? `<div class="row wrap" style="gap:8px">${sols.map(s => `<button class="btn ${s[0] === sols[0][0] ? 'pri' : ''}" data-act="w4-sol" data-tipo="${s[0]}" data-t="${esc(t.id)}" data-n="${esc(t.nombre)}">${ic(s[2], 'sm')} ${esc(s[1])}</button>`).join('')}</div>` : ''}${c.apartados ? '<p class="mut" style="font-size:13px;margin:8px 0 0">Apartas con un abono y terminas de pagar cuando lo recojas.</p>' : ''}</section>`);
    host.innerHTML = partes.join('');
  }
  (window.WK_HOOKS_TIENDA = window.WK_HOOKS_TIENDA || []).push(bloqueTienda);

  function formSolicitud(tipo, tid, tn) {

    const res = /^reserva/.test(tipo); const hab = tipo === 'reserva_habitacion';
    const hoy = new Date(Date.now() - 5 * 3600000).toISOString().slice(0, 10);
    const box = openModal(mHead(SOL_L[tipo] + ' · ' + tn, res ? 'clock' : 'file') + `<form class="mb wk-form" id="w4Sf" novalidate>
      ${res ? `<div class="fld"><label for="w4Sd">Fecha</label><input id="w4Sd" type="date" min="${hoy}" value="${hoy}" required></div>
        ${hab ? '<div class="fld"><label for="w4Sn">Noches</label><input id="w4Sn" type="number" min="1" max="60" value="1"></div>' : '<div class="fld"><label for="w4Sh">Hora</label><input id="w4Sh" type="time" value="20:00"></div>'}

      <div class="fld full"><label for="w4Sx">${tipo === 'cotizacion' ? 'Qué necesitas (productos y cantidades)' : tipo === 'apartado' ? 'Qué quieres apartar (producto, talla, color)' : 'Nota (opcional)'}</label><textarea id="w4Sx" rows="${res ? 2 : 4}" maxlength="500" placeholder="${tipo === 'cotizacion' ? 'Ej: 10 bultos de cemento, 6 varillas de 3/8' : tipo === 'apartado' ? 'Ej: chaqueta de jean talla M' : 'Ej: mesa cerca a la pista'}"></textarea></div>
      ${tipo === 'cotizacion' ? '<div class="fld full"><label for="w4Sa">Dirección de entrega (para calcular el flete)</label><input id="w4Sa" maxlength="160"></div>' : ''}

  /* ---------- "Arma tu pedido paso a paso" ---------- */
  async function pasoAPaso(tid) {
    const box = openModal(mHead('Arma tu pedido paso a paso', 'bag') + '<div class="mb"><div class="skel" style="height:300px"></div></div>', { wide: true });
    let prods; try { prods = toObjs(await call('list', { e: 'Productos', g: 0, f: { tienda_id: tid }, q: '', s: '', d: 1, n: 200, p: 1 })).recs; } catch (e) { $('.mb', box).innerHTML = errBox(e); return; }
    prods = prods.filter(p => p.tienda_abierta !== false && !(p.controla_stock === true && Number(p.stock) <= 0));
    if (!prods.length) { $('.mb', box).innerHTML = `<div class="empty">${ic('bag')}<p>Este negocio aún no tiene productos disponibles.</p></div>`; return; }
    const catN = id => ((S.cats || []).find(c => c.id === id) || {}).nombre || 'Otros';
    const grupos = []; prods.forEach(p => { const k = p.categoria_id || ''; let g = grupos.find(x => x.k === k); if (!g) grupos.push(g = { k, n: catN(k), ps: [] }); g.ps.push(p); });
    const sel = {}; let paso = 0; const total = grupos.length + 1;
    const sub = () => Object.keys(sel).reduce((a, id) => a + sel[id] * Number(prods.find(p => p.id === id).precio), 0);
    const pintar = () => {
      const fin = paso === grupos.length; const g = grupos[paso];
      $('.mb', box).innerHTML = `<ol class="wk4-pasos">${grupos.map((x, i) => `<li class="${i === paso ? 'on' : i < paso ? 'ok' : ''}">${esc(x.n)}</li>`).join('')}<li class="${fin ? 'on' : ''}">Resumen</li></ol>
        ${fin ? `<div class="wk4-fact"><h3>Resumen de tu pedido</h3>${Object.keys(sel).length ? `<table><thead><tr><th>Producto</th><th>Cant.</th><th>Valor</th></tr></thead><tbody>${Object.keys(sel).map(id => { const p = prods.find(x => x.id === id); return `<tr><td>${esc(p.nombre)}</td><td>${sel[id]}</td><td>${money(sel[id] * p.precio)}</td></tr>`; }).join('')}</tbody><tfoot><tr><td colspan="2">Subtotal</td><td>${money(sub())}</td></tr></tfoot></table><p class="mut" style="font-size:13px">El domicilio y la forma de pago se escogen en el siguiente paso.</p>` : '<p class="mut">Aún no escogiste productos.</p>'}</div>`
        : `<h3 style="margin:4px 0 12px">${esc(g.n)}</h3><div class="wk4-plist">${g.ps.map(p => `<div class="wk4-pi">${safeUrl(p.imagen) ? `<img src="${esc(p.imagen)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="wk4-pim">${ic('bag')}</span>`}<div class="grow"><b>${esc(p.nombre)}</b><span>${money(p.precio)}</span></div><div class="qty"><button type="button" data-q="-1" data-id="${esc(p.id)}" aria-label="Quitar uno">${ic('minus', 'sm')}</button><b>${sel[p.id] || 0}</b><button type="button" data-q="1" data-id="${esc(p.id)}" aria-label="Agregar uno">${ic('plus', 'sm')}</button></div></div>`).join('')}</div>`}
        <div class="ffoot"><span class="grow mut">Paso ${paso + 1} de ${total} · ${money(sub())}</span>${paso ? `<button class="btn ghost" data-nav="-1">${ic('left', 'sm')} Atrás</button>` : ''}${fin ? `<button class="btn pri" data-fin ${Object.keys(sel).length ? '' : 'disabled'}>${ic('cart', 'sm')} Agregar y pagar</button>` : `<button class="btn pri" data-nav="1">Siguiente ${ic('chevr', 'sm')}</button>`}</div>`;
    };
    pintar();
    box.addEventListener('click', e => {
      const q = e.target.closest('[data-q]'); const nv = e.target.closest('[data-nav]'); const fin = e.target.closest('[data-fin]');
      if (q) { const id = q.dataset.id; const p = prods.find(x => x.id === id); const max = p.controla_stock === true ? Number(p.stock) : 99; sel[id] = Math.max(0, Math.min(max, (sel[id] || 0) + Number(q.dataset.q))); if (!sel[id]) delete sel[id]; pintar(); }
      if (nv) { paso = Math.max(0, Math.min(grupos.length, paso + Number(nv.dataset.nav))); pintar(); }
      if (fin) {
        Object.keys(sel).forEach(id => { const p = prods.find(x => x.id === id); const cur = S.cart[id] ? S.cart[id].c : 0; S.cart[id] = { id, n: p.nombre, p: Number(p.precio), i: p.imagen || '', t: p.tienda_id, tn: p.tienda_id__n || '', c: cur + sel[id], mx: p.controla_stock === true ? Number(p.stock) : 999 }; });
        saveCart(); closeModal(); toast('Productos agregados al carrito.', 'ok'); location.hash = '#/checkout';
      }
    });
  }

    let det = null, jq = null;
    try { if ('BarcodeDetector' in window) { const ok = await BarcodeDetector.getSupportedFormats(); const f = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'].filter(x => ok.includes(x)); if (f.length) det = new BarcodeDetector({ formats: f }); } } catch (e) { det = null; }
    if (!det) { try { jq = await cargarJsQR(); $('#w5Sf', ov).textContent = 'Este celular solo lee etiquetas QR con la cámara. Para códigos de barras usa un lector USB o Bluetooth, o escribe el número.'; } catch (e) { cerrar(); return popup({ type: 'err', title: 'Lector', msg: 'No se pudo cargar el lector. Revisa tu internet.' }); } }
    const cv = document.createElement('canvas'); const cx = cv.getContext('2d', { willReadFrequently: true });
    const leer = async () => {
      if (!video.videoWidth) return '';
      if (det) { const r = await det.detect(video); return r[0] ? r[0].rawValue : ''; }
      const w = 480, h = Math.round(video.videoHeight * 480 / video.videoWidth); cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
      const r = jq(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' }); return r ? r.data : '';
    };
    const loop = async () => { if (!vivo) return; try { const v = await leer(); if (v) { if (navigator.vibrate) navigator.vibrate(80); cerrar(); alLeer(v); return; } } catch (e) { /* sigue */ } setTimeout(loop, 160); };
    loop();
  }

  /* =====================================================================
   * 2. INVENTARIO
   * ===================================================================== */
  async function tabInventario(b) { await cargar(true); pintarInv(b); }
  function pintarInv(b) {
    const d = POS.inv; const a = d.alertas;
    const f = POS.filtro; const q = norm(POS.buscar || '');
    let l = d.items.filter(x => (!f || x[f]) && (!q || norm(etiqueta(x) + ' ' + x.codigo).includes(q)));
    b.innerHTML = `<div class="wk5-alertas">
        <button type="button" class="wk5-al ${!f ? 'on' : ''}" data-act="w5-filtro" data-v=""><b>${d.items.length}</b><span>En inventario</span></button>
        <button type="button" class="wk5-al warn ${f === 'bajo' ? 'on' : ''}" data-act="w5-filtro" data-v="bajo"><b>${a.bajos}</b><span>Por agotarse</span></button>
        ${conVence() ? `<button type="button" class="wk5-al warn ${f === 'por_vencer' ? 'on' : ''}" data-act="w5-filtro" data-v="por_vencer"><b>${a.por_vencer}</b><span>Vencen en ${d.dias_vence} días</span></button>
        <button type="button" class="wk5-al err ${f === 'vencido' ? 'on' : ''}" data-act="w5-filtro" data-v="vencido"><b>${a.vencidos}</b><span>Vencidos</span></button>` : ''}</div>
      <div class="row wrap wk5-tools"><div class="wk5-buscar grow">${ic('search')}<label class="sr" for="w5Iq">Buscar en el inventario</label><input id="w5Iq" placeholder="Buscar por nombre o código" value="${esc(POS.buscar || '')}" autocomplete="off"><button type="button" class="btn ghost" data-act="w5-icam" aria-label="Buscar con la cámara">${ic('camera', 'sm')}</button></div>
        ${manda() ? `<button class="btn pri" data-act="w5-inuevo">${ic('plus', 'sm')} Agregar</button>` : ''}<button class="btn" data-act="w5-etiquetas" ${l.length ? '' : 'disabled'}>${ic('qr', 'sm')} Etiquetas QR</button></div>
      ${a.vencidos && conVence() ? `<div class="banner b-err" style="margin-bottom:12px">${ic('alert')}<div>Hay productos vencidos. El punto de venta no los deja vender. Sácalos de la venta y haz el conteo en cero.</div></div>` : ''}
      ${l.length ? `<div class="card wk5-inv">${l.map(x => { const pr = prodDe(x.producto_id); return `<div class="wk5-ir ${x.vencido ? 'vencido' : x.por_vencer ? 'porv' : ''}">
        ${safeUrl(pr.imagen) ? `<img src="${esc(pr.imagen)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="wk5-im">${ic('package')}</span>`}
        <div class="grow"><b>${esc(x.nombre)}${x.variante ? ` <span class="wk5-var">${esc(x.variante)}</span>` : ''}${x.formula ? ' <span class="wk5-rx">Fórmula</span>' : ''}</b>
          <small>${[x.codigo ? 'Código ' + esc(x.codigo) : 'Sin código', x.lote ? 'Lote ' + esc(x.lote) : '', x.vence ? `${x.vencido ? '<b class="wk5-err">Vencido</b>' : 'Vence'} ${esc(fechaCorta(x.vence))}` : '', money(precioDe(x))].filter(Boolean).join(' · ')}</small></div>
        <div class="wk5-st ${x.stock <= 0 ? 'cero' : x.bajo ? 'bajo' : ''}"><b>${num(x.stock)}</b><small>${x.stock_min ? 'mín. ' + x.stock_min : 'unid.'}</small></div>
        <div class="wk5-acc">${manda() ? `<button type="button" class="btn sm" data-act="w5-entrada" data-id="${esc(x.id)}">${ic('plus', 'sm')} Entrada</button><button type="button" class="btn sm ghost" data-act="w5-conteo" data-id="${esc(x.id)}">Conteo</button><button type="button" class="btn sm ghost" data-act="w5-ieditar" data-id="${esc(x.id)}" aria-label="Editar">${ic('edit', 'sm')}</button>` : ''}<button type="button" class="btn sm ghost" data-act="w5-hist" data-id="${esc(x.id)}" aria-label="Historial">${ic('clock', 'sm')}</button></div></div>`; }).join('')}</div>`
        : `<div class="empty">${ic('package')}<p>${d.items.length ? 'Nada coincide con el filtro.' : 'Aún no hay productos en el inventario.'}</p>${!d.items.length && manda() ? '<p class="mut">Agrega tus productos con su código de barras. Los que no agregues se venden igual, sin control de existencias.</p>' : ''}</div>`}`;
    const iq = $('#w5Iq'); iq.oninput = () => { POS.buscar = iq.value; clearTimeout(POS.tq); POS.tq = setTimeout(() => { const pos = iq.selectionStart; pintarInv(b); const n = $('#w5Iq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 200); };
  }

  function itemDlg(x) {
    const nuevo = !x; const cat = (POS.cat || []);
    const box = openModal(mHead(nuevo ? 'Agregar al inventario' : 'Editar ' + x.nombre, 'package') + `<form class="mb wk-form" id="w5If" novalidate>
      <div class="fld full"><label for="w5Ip">Producto del catálogo</label><select id="w5Ip" ${nuevo ? '' : 'disabled'} required><option value="">Elige el producto</option>${cat.map(p => `<option value="${esc(p.id)}" ${x && x.producto_id === p.id ? 'selected' : ''}>${esc(p.nombre)} · ${money(p.precio)}</option>`).join('')}</select><small class="hint">Si no está, créalo primero en Productos.</small></div>
      ${conTallas() ? `<div class="fld"><label for="w5It">Talla</label><input id="w5It" maxlength="20" value="${esc(x ? x.talla : '')}" placeholder="Ej: M, 32, 6 meses"></div><div class="fld"><label for="w5Ic">Color</label><input id="w5Ic" maxlength="30" value="${esc(x ? x.color : '')}" placeholder="Ej: Azul"></div>` : ''}
      <div class="fld full"><label for="w5Ib">Código de barras o QR</label><div class="row" style="gap:8px"><input id="w5Ib" class="grow" maxlength="64" value="${esc(x ? x.codigo : '')}" placeholder="Escanéalo o escríbelo (opcional)"><button type="button" class="btn" id="w5IbCam">${ic('camera', 'sm')}</button></div><small class="hint">Sin código, la app le hace una etiqueta QR propia.</small></div>
      ${nuevo ? `<div class="fld"><label for="w5Is">Existencias de hoy</label><input id="w5Is" inputmode="numeric" value="0"></div>` : ''}
      <div class="fld"><label for="w5Im">Avísame cuando queden</label><input id="w5Im" inputmode="numeric" value="${x ? x.stock_min || '' : ''}" placeholder="Ej: 5"></div>
      <div class="fld"><label for="w5Ipr">Precio distinto (opcional)</label><input id="w5Ipr" inputmode="numeric" value="${x && x.precio ? x.precio : ''}" placeholder="Vacío: el del catálogo"></div>
      ${conVence() ? `<div class="fld"><label for="w5Il">Lote</label><input id="w5Il" maxlength="30" value="${esc(x ? x.lote : '')}"></div><div class="fld"><label for="w5Iv">Fecha de vencimiento</label><input id="w5Iv" type="date" value="${esc(x ? x.vence : '')}"></div>` : ''}
      ${esFarma() ? `<label class="full wk5-chk"><input type="checkbox" id="w5Ix" ${x && x.formula ? 'checked' : ''}> Se vende con fórmula médica</label>` : ''}
      ${esFarma() && nuevo ? '<p class="full mut" style="margin:0;font-size:13px">Si llega otro lote del mismo producto, agrégalo aparte con su lote y vencimiento: al vender, sale primero el que vence antes.</p>' : ''}
      <div class="form-err hide full"></div><div class="ffoot full">${!nuevo ? `<button type="button" class="btn ghost danger" id="w5Idel">${ic('trash', 'sm')} Quitar</button><span class="grow"></span>` : ''}<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri" type="submit">${ic('check')} Guardar</button></div></form>`, { wide: true });
    $('#w5IbCam', box).onclick = () => escanear('Escanea el código', v => { const i = $('#w5Ib'); if (i) i.value = v; });
    const del = $('#w5Idel', box); if (del) del.onclick = async () => { if (!(await confirmDlg({ title: 'Quitar del inventario', msg: 'Deja de controlar sus existencias. El historial se conserva.', ok: 'Quitar', danger: true }))) return; try { await call('wk.inv.borrar', P({ id: x.id })); closeModal(); toast('Quitado del inventario.'); W.pintarTab(); } catch (e) { toast(e.message, 'err'); } };
    $('#w5If', box).onsubmit = e => { e.preventDefault(); busy($('[type=submit]', e.target), 'Guardando…', async () => {
      const v = id => ($('#' + id, box) || {}).value || '';
      try {
        await call('wk.inv.set', P({ id: x ? x.id : '', producto_id: x ? x.producto_id : v('w5Ip'), talla: v('w5It').trim(), color: v('w5Ic').trim(), codigo: v('w5Ib').trim(), stock: numIn(v('w5Is')), stock_min: numIn(v('w5Im')), precio: numIn(v('w5Ipr')), lote: v('w5Il').trim(), vence: v('w5Iv'), formula: !!($('#w5Ix', box) || {}).checked }));
        closeModal(); toast('Guardado en el inventario.', 'ok'); W.pintarTab();
      } catch (err) { const fe = $('.form-err', box); fe.textContent = /producto/i.test(err.message) && !v('w5Ip') ? 'Elige el producto.' : err.message; fe.classList.remove('hide'); }
    }); };
  }
  function movDlg(x, tipo) {
    const ent = tipo === 'entrada';
    const box = openModal(mHead((ent ? 'Entrada · ' : 'Conteo · ') + etiqueta(x), ent ? 'plus' : 'layers') + `<form class="mb wk-form" id="w5Mf" novalidate>
      <p class="full mut" style="margin:0">Hoy hay <b>${num(x.stock)}</b> según la app.</p>
      <div class="fld"><label for="w5Mc">${ent ? 'Cuántas unidades entraron' : 'Cuántas contaste'}</label><input id="w5Mc" inputmode="numeric" required></div>
      <div class="fld"><label for="w5Mn">Nota (opcional)</label><input id="w5Mn" maxlength="140" placeholder="${ent ? 'Ej: factura del proveedor 551' : 'Ej: conteo de fin de mes'}"></div>
      <div class="form-err hide full"></div><div class="ffoot full"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn pri" type="submit">${ic('check')} Guardar</button></div></form>`);
    $('#w5Mf', box).onsubmit = e => { e.preventDefault(); busy($('[type=submit]', e.target), 'Guardando…', async () => {
      try { const r = await call('wk.inv.mov', P({ id: x.id, tipo, cantidad: numIn($('#w5Mc').value), nota: $('#w5Mn').value.trim() })); closeModal(); toast(ent ? `Entrada guardada. Ahora hay ${num(r.item.stock)}.` : `Conteo guardado: ${num(r.item.stock)} (${r.item.stock - r.antes >= 0 ? '+' : ''}${r.item.stock - r.antes}).`, 'ok'); W.pintarTab(); }
      catch (err) { const fe = $('.form-err', box); fe.textContent = err.message; fe.classList.remove('hide'); }
    }); };
  }
  async function historial(x) {
    const box = openModal(mHead('Historial · ' + etiqueta(x), 'clock') + '<div class="mb"><div class="skel" style="height:200px"></div></div>');
    let l; try { l = await call('wk.inv.movs', P({ inv_id: x.id })); } catch (e) { $('.mb', box).innerHTML = errBox(e); return; }
    const TIP = { entrada: 'Entrada', venta: 'Venta', conteo: 'Conteo', anulacion: 'Anulación' };
    $('.mb', box).innerHTML = l.length ? `<ul class="wk4-reg wk5-hist">${l.map(m => `<li><span>${esc(m.fecha.slice(5, 16).replace('T', ' '))}</span><span>${esc(TIP[m.tipo] || m.tipo)}${m.referencia ? ' ' + esc(m.referencia) : ''} <b class="${m.cantidad < 0 ? 'wk5-err' : 'wk5-ok'}">${m.cantidad > 0 ? '+' : ''}${m.cantidad}</b></span><b>${num(m.saldo)}</b><small>${esc(m.usuario)}${m.nota ? ' · ' + esc(m.nota) : ''}</small></li>`).join('')}</ul>` : '<p class="mut">Sin movimientos.</p>';
  }

  /* ---------- etiquetas QR para imprimir ---------- */
  async function etiquetas() {
    const f = POS.filtro; const q = norm(POS.buscar || '');
    const l = POS.inv.items.filter(x => (!f || x[f]) && (!q || norm(etiqueta(x) + ' ' + x.codigo).includes(q))).slice(0, 120);
    let qr; try { qr = await cargarQR(); } catch (e) { toast('No se pudo cargar el generador de QR. Revisa tu internet.', 'err'); return; }
    const svg = txt => { const c = qr(0, 'M'); c.addData(txt); c.make(); return c.createSvgTag({ cellSize: 3, margin: 0, scalable: true }); };
    const tarjetas = l.map(x => `<div class="lbl">${svg('WUAKA:I:' + x.id)}<div><b>${esc(x.nombre)}</b>${x.variante ? `<span>${esc(x.variante)}</span>` : ''}<strong>${money(precioDe(x))}</strong><small>${esc(x.codigo || x.id)}${x.vence ? ' · V ' + esc(fechaCorta(x.vence)) : ''}</small></div></div>`).join('');
    const css = '.lbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(62mm,1fr));gap:3mm}.lbl{display:flex;gap:3mm;align-items:center;border:1px dashed #999;border-radius:2mm;padding:2.5mm;break-inside:avoid;font:11px/1.25 system-ui,sans-serif;color:#000;background:#fff}.lbl svg{width:22mm;height:22mm;flex:none}.lbl div{display:flex;flex-direction:column;min-width:0}.lbl b{font-size:11.5px}.lbl strong{font-size:14px}.lbl small{color:#444;word-break:break-all}';
    const box = openModal(mHead(`Etiquetas QR (${l.length})`, 'qr') + `<div class="mb stack"><p class="mut" style="margin:0">Imprímelas en papel adhesivo y pégalas en el producto o en el estante. El punto de venta las lee con la cámara o con un lector que lea QR.</p><style>${css}</style><div class="lbls wk5-lbls">${tarjetas}</div><div class="ffoot"><button type="button" class="btn ghost" data-close>Cerrar</button><button type="button" class="btn pri" id="w5Pr">${ic('file')} Imprimir</button></div></div>`, { wide: true });
    $('#w5Pr', box).onclick = () => { const fr = document.createElement('iframe'); fr.className = 'wk5-print'; fr.setAttribute('aria-hidden', 'true'); document.body.appendChild(fr); fr.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>Etiquetas</title><style>@page{margin:8mm}body{margin:0}${css}</style></head><body><div class="lbls">${tarjetas}</div></body></html>`; fr.onload = () => { try { fr.contentWindow.print(); } catch (e) { /* noop */ } setTimeout(() => fr.remove(), 60000); }; };
  }

  /* ---------- pestañas del tablero ---------- */
  W.pestana('pos', 'Punto de venta', 'cart', tabPos, ['Comercio', 'Farmacia', 'Almacén', 'Ferretería', 'Depósitos']);
  W.pestana('inventario', 'Inventario', 'package', tabInventario, ['Comercio', 'Farmacia', 'Almacén', 'Ferretería', 'Depósitos']);
  W.pestana('inventario', 'Inventario', 'package', tabInventario, ['Carnicería'], true);

  const itemDe = id => (POS.inv.items || []).find(x => x.id === id);
  Object.assign(ACTS, {
    'w5-cam': () => escanear('Escanear producto', v => buscarYAgregar(v)),
    'w5-icam': () => escanear('Buscar en el inventario', v => { POS.buscar = v.replace(/^(WUAKA|MUAKA):I:/i, ''); const x = itemDe(POS.buscar); if (x) POS.buscar = x.codigo || x.nombre; const b = $('#w4Body'); if (b && POS.inv) pintarInv(b); }),
    'w5-cobrar': el => cobrar(el),
    'w5-vaciar': () => { POS.carrito = []; pintarCarrito(); },
    'w5-recibo': el => { const v = (POS.ventas || []).find(x => x.id === el.dataset.id); if (v) recibo(v); },
    'w5-anular': async el => { const v = (POS.ventas || []).find(x => x.id === el.dataset.id); const m = await confirmDlg({ title: 'Anular ' + v.numero, msg: `Devuelve ${money(v.total)} de la caja y regresa los productos al inventario.`, ok: 'Anular venta', danger: true, input: { label: 'Motivo', req: true } }); if (!m) return; try { await call('wk.pos.anular', P({ id: v.id, motivo: m })); toast('Venta anulada.', 'ok'); POS.inv = null; await cargar(true); hoy(); } catch (e) { toast(/caja/i.test(e.message) ? 'Primero abre la Caja del día.' : e.message, 'err'); } },
    'w5-filtro': el => { POS.filtro = el.dataset.v; const b = $('#w4Body'); if (b && POS.inv) pintarInv(b); },
    'w5-inuevo': () => itemDlg(null),
    'w5-ieditar': el => itemDlg(itemDe(el.dataset.id)),
    'w5-entrada': el => movDlg(itemDe(el.dataset.id), 'entrada'),
    'w5-conteo': el => movDlg(itemDe(el.dataset.id), 'conteo'),
    'w5-hist': el => historial(itemDe(el.dataset.id)),
    'w5-etiquetas': () => etiquetas()
  });
  document.addEventListener('click', e => { const b = e.target.closest('[data-cq],[data-rec]'); if (!b || !$('#w5Cart')) return;
    if (b.dataset.rec) { const pago = $('#w5Pago'); pago.dataset.recibido = b.dataset.rec; pintarCarrito(); return; }
    const i = Number(b.dataset.i); const x = POS.carrito[i]; if (!x) return; const n = x.c + Number(b.dataset.cq);
    if (!x.libre && n > x.max) { toast(`Solo hay ${x.max} en el inventario.`, 'err'); return; }
    if (n <= 0) POS.carrito.splice(i, 1); else x.c = n; pintarCarrito(); });

  /* =====================================================================
   * 3. TALLAS Y COLORES EN LA FICHA DEL PRODUCTO
   * ===================================================================== */
  const VAR_CACHE = {};
  const _openProduct = openProduct;
  openProduct = async function (p) {
    const r = await _openProduct(p);
    const box = $('.modal [id="pDesc"]'); if (!box || !p || !p.id) return r;
    try {
      const d = VAR_CACHE[p.id] && Date.now() - VAR_CACHE[p.id].t < 120000 ? VAR_CACHE[p.id].d : (VAR_CACHE[p.id] = { t: Date.now(), d: await call('wk.inv.pub', { producto_id: p.id }) }).d;
      const vs = d.variantes || []; if (!vs.length || !box.isConnected) return r;
      box.insertAdjacentHTML('afterend', `<div class="wk5-vars"><small>Tallas y colores en la tienda</small><div>${vs.map(v => `<span class="chip">${esc(v.variante)}${v.pocas ? ' · quedan pocas' : ''}</span>`).join('')}</div><small class="mut">Escríbele al negocio para confirmar la tuya antes de pagar.</small></div>`);
    } catch (e) { /* sin módulo V5: no se muestra */ }
    return r;
  };

  window.WK_V5 = { version: '5.0.0', escanear };
})();

</script>
</body>
